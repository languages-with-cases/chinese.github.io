:root{
  --g:#16a34a; --g-d:#15803d; --g-dd:#14532d; --g-l:#dcfce7; --g-ll:#f0fdf4;
  --ink:#0f172a; --mut:#64748b; --line:#e2e8f0; --bg:#ffffff; --soft:#f8fafc;
  --bad:#dc2626; --bad-l:#fee2e2; --amber:#d97706;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-style:normal}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:'Onest','Noto Sans SC',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.45}
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:.02em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#app{max-width:480px;margin:0 auto;min-height:100%;position:relative;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
.top{padding:max(14px,env(safe-area-inset-top)) 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:800;font-size:19px;letter-spacing:-.01em}
.brand b{color:var(--g)}
.chips{display:flex;gap:8px}
.chip{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:5px 11px;font-weight:700;font-size:14px}
.chip svg{width:16px;height:16px}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;background:#fff;border-top:1.5px solid var(--line);
  display:flex;padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:20}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mut);font-weight:700;font-size:12px;padding:6px 0;border-radius:12px;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.nav button:active{transform:scale(.92)}
.nav button.on{color:var(--g-d);background:var(--g-ll)}
.nav svg{width:24px;height:24px}
.btn{display:block;width:100%;background:var(--g);color:#fff;font-weight:800;border-radius:var(--r);padding:15px;text-align:center;
  box-shadow:0 4px 0 var(--g-d);transition:transform .15s cubic-bezier(.3,1.6,.5,1),box-shadow .15s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--g-d)}
.btn[disabled]{background:#e2e8f0;color:#94a3b8;box-shadow:0 4px 0 #cbd5e1;cursor:default}
.btn.ghost{background:#fff;color:var(--g-d);border:1.5px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.bad{background:var(--bad);box-shadow:0 4px 0 #991b1b}

/* path */
.rand{margin:4px 18px 8px;display:flex;align-items:center;justify-content:center;gap:8px}
.rand .btn{padding:12px}
.stage{margin:14px 18px 6px;border-radius:var(--r);background:var(--g);color:#fff;padding:14px 16px}
.stage.lock{background:#94a3b8}
.stage small{opacity:.9;font-weight:600;display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.stage h2{margin:2px 0 0;font-size:19px;letter-spacing:-.01em}
.stage p{margin:4px 0 0;font-size:13px;opacity:.92}
.track{position:relative;padding:8px 0 4px}
.track svg.line{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.node-row{display:flex;justify-content:center;position:relative;height:134px}
.node{position:absolute;top:0;display:flex;flex-direction:column;align-items:center;width:150px;text-align:center}
.dot{width:66px;height:66px;border-radius:50%;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:22px;box-shadow:0 5px 0 var(--g-d);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.dot:active{transform:translateY(3px) scale(.96);box-shadow:0 2px 0 var(--g-d)}
.dot svg{width:28px;height:28px}

const OPTINFO = {"很幸运，一切都好。谢谢您来接我们。":{"p":"Hěn xìngyùn, yíqiè dōu hǎo. xièxie nín lái jiē wǒmen.","r":"Нам повезло, всё хорошо. Спасибо, что встретили нас."},"我很累，请马上送我们去饭店休息，别的事明天再说吧。":{"p":"Wǒ hěn lěi, qǐng mǎshàng sòng wǒmen qù fàndiàn xiūxī, bié de shì míngtiān zàishuō ba.","r":"Я очень устал, отвезите нас сразу в гостиницу отдыхать, остальное — завтра."},"还可以，就是飞机上的饭太难吃了，座位也特别挤。":{"p":"Hái kěyǐ, jiùshì fēijī shàng de fàn tài nán chī le, zuò wèi yě tèbié jǐ.","r":"Нормально, только еда в самолёте была ужасная, а места очень тесные."},"没关系，我们理解。请代我们向王主任问好。":{"p":"Méi guānxi, wǒmen lǐjiě. qǐng dài wǒmen xiàng wáng zhǔrèn wènhǎo.","r":"Ничего страшного, мы понимаем. Передайте от нас привет директору Вану."},"那太遗憾了，那我们还是改天再谈吧。":{"p":"Nà tài yíhàn le, nà wǒmen háishi gǎi tiān zài tán ba.","r":"Как жаль, тогда давайте встретимся в другой день."},"为什么他不来？这对我们不太尊重。":{"p":"Wèi shénme tā bù lái? zhè duì wǒmen bútài zūn zhòng.","r":"Почему он не приехал? Это неуважение к нам."},"对你们的热情接待表示感谢。":{"p":"Duì nǐmen de rèqíng jiēdài biǎoshì gǎnxiè.","r":"Благодарим за тёплый приём."},"你们接待得还行，谢谢。":{"p":"Nǐmen jiēdài de hái xíng, xièxie.","r":"Приняли вы нас так себе, спасибо."},"接待就这样吧，下次可以再周到一点儿。":{"p":"Jiēdài jiù zhèyàng ba, xiàcì kěyǐ zài zhōudào yìdiǎnr.","r":"Приём так себе; в следующий раз можно быть и внимательнее."},"谢谢，客随主便，听从张总经理的安排。":{"p":"Xièxie, kèsuí zhǔbiàn, tīng cóng zhāng zǒngjīnglǐ de ānpái.","r":"Спасибо, хозяин решает — подчиняемся распоряжению генерального директора Чжана."},"谢谢，但是我们明天很忙，你们改一个时间吧。":{"p":"Xièxie, dànshì wǒmen míngtiān hěn máng, nǐmen gǎi yí gè shíjiān ba.","r":"Спасибо, но завтра мы очень заняты, назначьте другое время."},"好的，不过我们不太喜欢烤鸭，请换一家饭店。":{"p":"Hǎo de, búguò wǒmen bútài xǐhuan kǎoyā, qǐng huàn yì jiā fàndiàn.","r":"Хорошо, но мы не любим утку по-пекински, смените ресторан."},"谢谢张总经理的盛情款待！为我们的友好合作干杯！":{"p":"Xièxie zhāng zǒngjīnglǐ de shèngqíng kuǎndài! wèi wǒmen de yǒuhǎo hézuò gānbēi!","r":"Спасибо за радушное угощение, господин Чжан! Выпьем за нашу дружбу и сотрудничество!"},"谢谢，不过我不会喝酒，所以不能干杯，请大家自己喝吧。":{"p":"Xièxie, búguò wǒ búhuì hē jiǔ, suǒyǐ bù néng gānbēi, qǐng dàjiā zìjǐ hē ba.","r":"Спасибо, но я не пью, поэтому чокаться не буду — пейте сами."},"好的，现在可以谈合同的价格了吗？":{"p":"Hǎo de, xiànzài kěyǐ tán hétóng de jiàgé le ma?","r":"Хорошо, можно уже обсудить цену по контракту?"},"说得太好了。中国人向来都是热情好客的。":{"p":"Shuōde tài hǎo le. zhōngguórén xiànglái dōushì rèqíng hàokè de.","r":"Прекрасно сказано. Китайцы всегда были гостеприимны."},"这只是一句客套话吧？我们不太相信这种说法。":{"p":"Zhè zhǐshì yí jù kètàohuà ba? wǒmen bútài xiāngxìn zhè zhǒng shuōfǎ.","r":"Это просто вежливая фраза? Мы в такое не очень верим."},"谢谢，不过我觉得我们住的饭店比家里还要舒服。":{"p":"Xièxie, búguò wǒ juéde wǒmen zhù de fàndiàn bǐ jiā lǐ hái yào shū fú.","r":"Спасибо, но наша гостиница удобнее, чем дом."},"我们想先到中国驻莫斯科的商务处，要一份中国各专业公司的介绍。":{"p":"Wǒmen xiǎng xiān dào zhōngguó zhù mòsīkē de shāng wù chù, yào yí fèn zhōngguó gè zhuānyè gōngsī de jièshào.","r":"Сначала мы хотим зайти в торговое представительство Китая в Москве и взять описание китайских специализированных компаний."},"我们想直接去中国，随便找一家公司谈。":{"p":"Wǒmen xiǎng zhíjiē qù zhōngguó, suíbiàn zhǎo yì jiā gōngsī tán.","r":"Мы хотим сразу поехать в Китай и найти любую компанию для переговоров."},"我们不需要主动联系，等中国公司来找我们，他们自然会给我们寄资料。":{"p":"Wǒmen bù xūyào zhǔdòng liánxì, děng zhōngguó gōngsī lái zhǎo wǒmen, tāmen zìrán huì gěi wǒmen jì zīliào.","r":"Нам не нужно связываться самим: подождём, пока китайские компании сами придут и пришлют материалы."},"秋季的，十月十五日至十一月五日，我们想先去参观。":{"p":"Qiūjì de, shíyuè shí wǔ rì zhì shíyī yuè wǔ rì, wǒmen xiǎng xiān qù cānguān.","r":"Осенняя, с 15 октября по 5 ноября; сначала мы хотим её посетить."},"秋季的，四月十五日至五月五日，我们想先去参观一下。":{"p":"Qiūjì de, sì yuè shí wǔ rì zhì wǔ yuè wǔ rì, wǒmen xiǎng xiān qù cānguān yíxià.","r":"Осенняя, с 15 апреля по 5 мая; сначала мы хотим сходить посмотреть."},"我听说广交会在哈尔滨举行，每年只举行一次，我们去那里。":{"p":"Wǒ tīng shuō guǎngjiāohuì zài hā'ěrbīn jǔ xíng, měinián zhǐ jǔ xíng yí cì, wǒmen qù nà lǐ.","r":"Слышал, Кантонская ярмарка проходит в Харбине раз в год, мы поедем туда."},"陈先生，您介绍得那么详细，太感谢您了！":{"p":"Chén xiānsheng, nín jièshào de nàme xiángxì, tài gǎnxiè nín le!","r":"Господин Чэнь, вы так подробно объяснили, большое спасибо!"},"谢谢，这些我基本上都知道。":{"p":"Xièxie, zhèxiē wǒ jīběnshàng dōu zhīdào.","r":"Спасибо, это всё я в основном уже знал."},"好，信息够了，再见。":{"p":"Hǎo, xìnxī gòu le, zàijiàn.","r":"Хорошо, информации достаточно, до свидания."},"可以。我们需要三千件，请报成本加运费、保险费到圣彼得堡的价格。":{"p":"Kěyǐ. wǒmen xūyào sān qiān jiàn, qǐng bào chéngběn jiā yùnfèi, bǎoxiǎnfèi dào shèngbǐdébǎo de jiàgé.","r":"Можно. Нам нужно три тысячи штук; назовите цену CIF до Санкт-Петербурга."},"数量以后再说，你们先把最低价告诉我们，我们回国后再慢慢研究一下。":{"p":"Shùliàng yǐhòu zàishuō, nǐmen xiān bǎ zuì dī jià gàosù wǒmen, wǒmen huíguó hòu zài mànmàn yánjiū yíxià.","r":"Количество — потом; сначала назовите минимальную цену, дома мы спокойно изучим."},"数量不重要，请报船上交货的价格，保险和运费你们不用管。":{"p":"Shùliàng bú zhòngyào, qǐng bào chuán shàng jiāohuò de jiàgé, bǎoxiǎn hé yùnfèi nǐmen búyòng guǎn.","r":"Количество неважно, назовите цену FOB; страховка и фрахт — не ваша забота."},"明白。如果订货量大，希望你们认真考虑给我们百分之二到三的佣金。":{"p":"Míng bái. rúguǒ dìnghuòliàng dà, xīwàng nǐmen rèn zhēn kǎolǜ gěi wǒmen bǎi fēn zhī èr dào sān de yòngjīn.","r":"Понятно. При большом заказе просим серьёзно рассмотреть комиссию в 2–3 процента."},"没有佣金，我们就不订货了，不用再谈。":{"p":"Méiyǒu yòngjīn, wǒmen jiù bú dìnghuò le, búyòng zài tán.","r":"Без комиссии мы заказывать не будем, больше не о чем говорить."},"那算了，我们去找别的供货商。":{"p":"Nà suàn le, wǒmen qù zhǎo bié de gōnghuòshāng.","r":"Тогда забудьте, найдём других поставщиков."},"请问你们的报价有效期是多久？":{"p":"Qǐngwèn nǐmen de bàojià yǒuxiàoqī shì duōjiǔ?","r":"Скажите, как долго действует ваше предложение?"},"报价什么时候过期？":{"p":"Bàojià shénme shíhou guòqī?","r":"Когда истекает срок предложения?"},"三天有效？太短了，我们不能接受。":{"p":"Sāntiān yǒuxiào? tài duǎn le, wǒmen bù néng jiēshòu.","r":"Три дня? Слишком мало, мы не можем принять."},"这个价格比去年高了差不多百分之十五，我方很难推销，希望你们重新考虑。":{"p":"Zhègè jiàgé bǐ qù nián gāo le chàbuduō bǎi fēn zhī shí wǔ, wǒfāng hěn nán tuīxiāo, xīwàng nǐmen chóngxīn kǎolǜ.","r":"Цена выше прошлогодней почти на 15%, нам трудно продавать; просим пересмотреть."},"你们的价格太离谱了，我们不可能买。":{"p":"Nǐmen de jiàgé tài lípǔ le, wǒmen bù kěnéng mǎi.","r":"Ваши цены абсурдны, мы не купим."},"好，24.5美金，我们马上订货，不用再谈了。":{"p":"Hǎo, 24.5 měijīn, wǒmen mǎshàng dìnghuò, búyòng zài tán le.","r":"Хорошо, 24,5 доллара, заказываем сразу, больше не обсуждаем."},"我承认你方女装质量好，款式新颖，但同时有其他公司的产品在竞争。":{"p":"Wǒ chéng rèn nǐfāng nǚzhuāng zhìliànghǎo, kuǎnshì xīnyǐng, dàn tóngshí yǒu qítā gōngsī de chǎnpǐn zài jìngzhēng.","r":"Признаю, ваша женская одежда качественная и модная, но конкурируют и другие компании."},"质量好不好我不知道，我只看价格。":{"p":"Zhìliànghǎo bù hǎo wǒ bù zhīdào, wǒ zhǐ kàn jiàgé.","r":"Хорошее ли качество — не знаю, я смотрю только на цену."},"质量都差不多，我看你们是在夸大其词，故意想多收我们的钱，这样不太合适。":{"p":"Zhìliàng dōu chàbuduō, wǒ kàn nǐmen shì zài kuādà qící, gùyì xiǎng duō shōu wǒmen de qián, zhèyàng bútài héshì.","r":"Качество у всех примерно одинаковое; вы преувеличиваете, чтобы взять с нас больше, так нехорошо."},"作为老客户，我们只要求你方的价格能和别处差不多，这个要求是合理的，对吧？":{"p":"Zuòwéi lǎo kèhù, wǒmen zhǐyào qiú nǐfāng de jiàgé néng hé biéchù chàbuduō, zhègè yào qiúshì hélǐ de, duìba?","r":"Как давним клиентам нам нужна цена не выше, чем в других местах; это разумно, да?"},"你们必须给我们最低价，不然我们就不买了，我们有很多别的供货商可以选择。":{"p":"Nǐmen bìxū gěi wǒmen zuì dī jià, bùrán wǒmen jiù bù mǎi le, wǒmen yǒu hěn duō bié de gōnghuòshāng kěyǐ xuǎnzé.","r":"Дайте нам минимальную цену, иначе не купим: поставщиков у нас много."},"别处都比你们便宜，你们的价格一点儿都不合理，我们实在无法向客户交代。":{"p":"Biéchù dōu bǐ nǐmen piányi, nǐmen de jiàgé yìdiǎnr dōubù hélǐ, wǒmen shízài wú fǎ xiàng kèhù jiāo dài.","r":"Везде дешевле, ваши цены совсем необоснованны, мы не сможем объяснить это клиентам."},"陈先生，货币波动使我们难以开价。我需要和总公司联系一下，请给我们一些时间。":{"p":"Chén xiānsheng, huòbì bōdòng shǐ wǒmen nányǐ kāijià. wǒ xūyào hé zǒnggōngsī liánxì yīxià, qǐng gěi wǒmen yìxiē shíjiān.","r":"Господин Чэнь, колебания курса затрудняют назначение цены. Мне нужно связаться с головной компанией, дайте немного времени."},"这就是国际市场的价格，我们不会降价，你们要买就买，不买就算了，我们没有时间再谈。":{"p":"Zhè jiùshì guójì shìchǎng de jiàgé, wǒmen búhuì jiàngjià, nǐmen yào mǎi jiù mǎi, bù mǎi jiù suàn le, wǒmen méiyǒu shíjiān zài tán.","r":"Это мировая рыночная цена, мы не снизим: хотите — берите, не хотите — не надо, времени нет."},"好的，那我们马上降价百分之三十。":{"p":"Hǎo de, nà wǒmen mǎshàng jiàngjià bǎi fēn zhī sān shí.","r":"Хорошо, тогда сразу снижаем цену на 30%."},"谢谢，我们一收到总公司的答复，就立即通知您。":{"p":"Xièxie, wǒmen yì shōudào zǒnggōngsī de dáfù, jiù lìjí tōngzhī nín.","r":"Спасибо, как только получим ответ головной компании, сразу сообщим вам."},"知道了，不过我们不一定会通知你们，要看总公司怎么回答。":{"p":"Zhīdao le, búguò wǒmen bù yídìng huì tōngzhī nǐmen, yào kàn zǒnggōngsī zěnme huídá.","r":"Понятно, но мы не обязательно сообщим: зависит от ответа головной компании."},"一周不够，我们需要一个月，总公司的答复通常很慢。":{"p":"Yì zhōu búgòu, wǒmen xūyào yí gè yuè, zǒnggōngsī de dáfù tōngcháng hěn màn.","r":"Недели мало, нужен месяц: ответ головной компании обычно приходит медленно."},"请原谅我们未能对你们的询价作出更积极的反应。":{"p":"Qǐng yuánliàng wǒmen wèi néng duì nǐmen de xúnjià zuòchū gèng jījí de fǎnyìng.","r":"Простите, что мы не отреагировали активнее на ваш запрос цены."},"当时我们太忙了，没办法。":{"p":"Dāngshí wǒmen tài máng le, méi bànfa.","r":"Тогда мы были слишком заняты, ничего не поделаешь."},"这是货币危机的问题，不是我们的问题。":{"p":"Zhèshì huòbì wēijī de wèntí, búshì wǒmen de wèntí.","r":"Это проблема валютного кризиса, а не наша."},"能不能互相作出一些让步？双方都再各让一半，生意不就能成交了吗？":{"p":"Néng bu néng hùxiāng zuòchū yìxiē ràngbù? shuāngfāng dōu zài gèràng yībàn, shēngyì bú jiù néng chéngjiāo le ma?","r":"Может, уступим друг другу? Если каждый уступит половину, сделка состоится, не так ли?"},"如果不能再让，我们干脆放弃这笔生意算了，没有必要再浪费时间。":{"p":"Rúguǒ bù néng zài ràng, wǒmen gāncuì fàngqì zhè bǐ shēngyì suàn le, méiyǒu bì yào zài làngfèi shíjiān.","r":"Если больше нельзя уступать, давайте просто откажемся от сделки, не стоит тратить время."},"你们的价格永远比别人的高，我们没法合作，也不想再谈下去了。":{"p":"Nǐmen de jiàgé yǒngyuǎn bǐ bié rén de gāo, wǒmen méifǎ hézuò, yě bùxiǎng zài tán xià qù le.","r":"Ваши цены всегда выше, мы не можем сотрудничать и не хотим продолжать."},"这样还剩下20美元的差额。我们再各让一半吧，差额就可消除。":{"p":"Zhèyàng hái shèngxià 20 měiyuán de chā'é. wǒmen zài gèràng yībàn ba, chā'é jiù kě xiāochú.","r":"Остаётся разница в 20 долларов. Давайте снова поделим пополам, и разницы не будет."},"30美元太少了，我们只接受减100美元。":{"p":"30 měiyuán tài shǎo le, wǒmen zhǐ jiēshòu jiǎn 100 měiyuán.","r":"30 долларов — слишком мало, мы согласны только на скидку в 100."},"那20美元的差额我们不管了，你们自己想办法。":{"p":"Nà 20 měiyuán de chā'é wǒmen bùguǎn le, nǐmen zìjǐ xiǎng bànfa.","r":"Разница в 20 долларов нас не касается, решайте сами."},"双方在价格上达成了协议，我很高兴。在下一次谈判中，我们再磋商其他条款。":{"p":"Shuāngfāng zài jiàgé shàng dáchéng le xiéyì, wǒ hěn gāoxìng. zài xià yí cì tánpàn zhōng, wǒmen zài cuōshāng qítā tiáokuǎn.","r":"Мы договорились о цене, я рад. На следующих переговорах обсудим другие условия."},"好吧，反正也没别的办法了。":{"p":"Hǎoba, fǎnzhèng yě méi bié de bànfa le.","r":"Ладно, всё равно других вариантов нет."},"价格谈完了，下一个问题，请快点儿说，我们的时间不多，不想再在价格上浪费时间了。":{"p":"Jiàgé tán wán le, xià yí gè wèntí, qǐng kuài diǎnr shuō, wǒmen de shíjiān bù duō, bùxiǎng zài zài jiàgé shàng làngfèi shíjiān le.","r":"Цену обсудили, следующий вопрос — быстрее, времени мало, не хочу больше тратить его на цену."},"信用证会增加我方的成本。我们能不能各让一步：货价的百分之五十用信用证，其余付款交单？":{"p":"Xìnyòngzhèng huì zēngjiā wǒfāng de chéngběn. wǒmen néng bu néng gè ràng yí bù: huòjià de bǎi fēn zhī wǔ shí yòng xìnyòngzhèng, qí yú fùkuǎn jiāodān?","r":"Аккредитив повышает наши расходы. Можем ли уступить друг другу: 50% — аккредитивом, остальное — документы против платежа?"},"我们只接受承兑交单，信用证绝对不行。":{"p":"Wǒmen zhǐ jiēshòu chéngduì jiāodān, xìnyòngzhèng juéduì bùxíng.","r":"Мы принимаем только документы против акцепта, аккредитив ни в коем случае."},"好，信用证就信用证，其他条件都不用谈了。":{"p":"Hǎo, xìnyòngzhèng jiù xìnyòngzhèng, qítā tiáojiàn dōubù yòng tán le.","r":"Ладно, пусть аккредитив, остальные условия обсуждать не будем."},"明白了。我一回去就着手开立信用证，下月初开出，请你们收到后马上发货。":{"p":"Míngbai le. wǒ yì huí qù jiù zhuóshǒu kāilì xìnyòngzhèng, xiàyuè chū kāi chū, qǐng nǐmen shōudào hòu mǎshàng fāhuò.","r":"Понял. Вернувшись, сразу займусь открытием аккредитива, в начале следующего месяца; по получении сразу отгружайте."},"一个月太长了，我们交货前一周开证。":{"p":"Yí gè yuè tài cháng le, wǒmen jiāohuò qián yì zhōu kāizhèng.","r":"Месяц — слишком долго, откроем за неделю до поставки."},"我们先发货再付款吧，信用证以后再说，这样双方都能节省很多时间和手续费。":{"p":"Wǒmen xiān fāhuò zài fùkuǎn ba, xìnyòngzhèng yǐhòu zàishuō, zhèyàng shuāngfāng dōu néng jiéshěng hěn duō shíjiān hé shǒuxùfèi.","r":"Давайте сначала отгрузите, потом оплатим, аккредитив — позже, так экономится время и комиссии."},"你们能不能破个例，接受付款交单？":{"p":"Nǐmen néng bu néng pògèlì, jiēshòu fùkuǎn jiāodān?","r":"Не могли бы вы сделать исключение и принять документы против платежа?"},"你们必须接受付款交单，否则我们不签合同。":{"p":"Nǐmen bìxū jiēshòu fùkuǎn jiāodān, fǒuzé wǒmen bù qiān hétóng.","r":"Вы обязаны принять документы против платежа, иначе контракт не подпишем."},"付款交单还是别的，反正我们不用信用证。":{"p":"Fùkuǎn jiāodān háishi bié de, fǎnzhèng wǒmen búyòng xìnyòngzhèng.","r":"Документы против платежа или что-то другое — аккредитив мы всё равно не используем."},"我们理解分期付款的要求，但没有信用证担保，我们很难向银行融资。是否可以向第三国银行申请贷款？":{"p":"Wǒmen lǐjiě fēnqī fùkuǎn de yào qiú, dàn méiyǒu xìnyòngzhèng dānbǎo, wǒmen hěn nán xiàng yínháng róngzī. shìfǒu kěyǐ xiàng dì sān guó yínháng shēnqǐng dàikuǎn?","r":"Мы понимаем просьбу о платеже в рассрочку, но без гарантии аккредитива нам трудно получить банковское финансирование. Можно ли взять кредит в банке третьей страны?"},"分期付款我们不能接受，我们只要即期付款，没有商量余地，请你们按这个条件重新考虑一下付款方式吧。":{"p":"Fēnqī fùkuǎn wǒmen bù néng jiēshòu, wǒmen zhǐyào jíqī fùkuǎn, méiyǒu shāng liàng yúdì, qǐng nǐmen àn zhègè tiáojiàn chóngxīn kǎolǜ yíxià fùkuǎn fāngshì ba.","r":"Рассрочку мы не принимаем, только немедленная оплата, обсуждению не подлежит; пересмотрите способ оплаты."},"那就按你们的办法，我们自己想办法垫付全部费用。":{"p":"Nàjiù àn nǐmen de bànfa, wǒmen zìjǐ xiǎng bànfa diànfù quánbù fèiyòng.","r":"Тогда по-вашему, мы сами как-нибудь оплатим все расходы вперёд."},"好的，如果方便的话，明天上午十点我们再谈一次。":{"p":"Hǎo de, rúguǒ fāngbiàn dehuà, míngtiān shàng wǔ shí diǎn wǒmen zài tán yí cì.","r":"Хорошо, если удобно, завтра в десять утра встретимся ещё раз."},"不行，今天必须有结果，否则我们明天就回国，不再谈了。":{"p":"Bùxíng, jīntiān bìxū yǒu jié guǒ, fǒuzé wǒmen míngtiān jiù huíguó, bú zài tán le.","r":"Нет, результат нужен сегодня, иначе завтра мы уезжаем и переговоров не будет."},"你们研究吧，我们就不再来了，请把结果寄给我们就可以了。":{"p":"Nǐmen yánjiū ba, wǒmen jiù bú zài lái le, qǐng bǎ jié guǒ jì gěi wǒmen jiù kěyǐ le.","r":"Изучайте, мы больше не приедем, просто пришлите нам результат."},"我必须说，这仅仅是我们的建议，希望听听你们有关这方面的意见。":{"p":"Wǒ bìxū shuō, zhè jǐn jǐn shì wǒmen de jiànyì, xīwàng tīng tīng nǐmen yǒuguān zhè fāng miàn de yìjiàn.","r":"Должен сказать: это лишь наше предложение, хотелось бы услышать ваше мнение."},"这是我们的最终决定，你们照办就行了。":{"p":"Zhèshì wǒmen de zuìzhōng juédìng, nǐmen zhàobàn jiùxíng le.","r":"Это наше окончательное решение, просто выполняйте."},"你们要是不同意，那就是不想合作。":{"p":"Nǐmen yàoshì bùtóngyì, nàjiù shì bùxiǎng hézuò.","r":"Если вы не согласны, значит, не хотите сотрудничать."},"我们准备削价百分之五，希望我方这一步能打开局面。":{"p":"Wǒmen zhǔnbèi xuējià bǎi fēn zhī wǔ, xīwàng wǒfāng zhè yí bù néng dǎkāi júmiàn.","r":"Мы готовы снизить цену на 5%, надеемся, этот шаг с нашей стороны сдвинет дело."},"这已经是底价了，我们一分钱也不能让，你们接受或者不接受。":{"p":"Zhè yǐjīng shì dǐ jià le, wǒmen yì fēn qián yě bù néng ràng, nǐmen jiēshòu huòzhě bùjiēshòu.","r":"Это уже минимальная цена, мы не уступим ни копейки: принимайте или нет."},"我们可以削价百分之五十，请马上签合同，不要再犹豫了。":{"p":"Wǒmen kěyǐ xuējià bǎi fēn zhī wǔ shí, qǐng mǎshàng qiān hétóng, búyào zài yóuyù le.","r":"Мы можем снизить цену на 50%, подписывайте контракт сейчас, не колеблясь."},"我无权同意这样大幅度削价，请您等我一、两天，我要等国内公司的答复。":{"p":"Wǒ wú quán tóngyì zhèyàng dà fúdù xuējià, qǐngnín děng wǒ yī, liǎngtiān, wǒ yào děng guónèi gōngsī de dáfù.","r":"У меня нет полномочий согласиться на такое большое снижение, подождите день-два — жду ответа из страны."},"那你们就去别处买吧，我们不在乎。":{"p":"Nà nǐmen jiù qù biéchù mǎi ba, wǒmen búzàihū.","r":"Тогда покупайте в другом месте, нам всё равно."},"好，我同意，您说多少就多少。":{"p":"Hǎo, wǒ tóngyì, nín shuō duōshǎo jiù duōshǎo.","r":"Хорошо, согласен, сколько скажете — столько и будет."},"交易就按此价定下来吧。我们逐项检查一下其它条款，看看有没有意见不一致的地方。":{"p":"Jiāoyì jiù àn cǐ jià dìng xiàlái ba. wǒmen zhúxiàng jiǎnchá yíxià qítā tiáokuǎn, kànkàn yǒu méiyǒu yìjiàn bù yí zhì de dìfang.","r":"Цену фиксируем так. Давайте по пунктам проверим остальные условия, нет ли разногласий."},"价格定了，其他条款你们看着办吧。":{"p":"Jiàgé dìng le, qítā tiáokuǎn nǐmen kànzhe bàn ba.","r":"Цена согласована, остальные условия — как сами решите."},"价格定了，合同不用写了，口头说定就行，我们公司一向相信朋友之间的口头承诺和信用。":{"p":"Jiàgé dìng le, hétóng búyòng xiě le, kǒutóu shuō dìng jiùxíng, wǒmen gōngsī yíxiàng xiāngxìn péngyou zhījiān de kǒutóu chéngnuò hé xìnyòng.","r":"Цена согласована, контракт писать не надо, хватит устной договорённости: мы всегда верим слову и доверию между друзьями."},"李先生，适时交货对我们关系很大，九月份是上市季节。您能不能想办法说服厂家提前一些交货？":{"p":"Lǐ xiānsheng, shìshí jiāohuò duì wǒmen guānxi hěn dà, jiǔyuèfèn shì shàngshì jìjié. nín néng bu néng xiǎng bànfa shuìfú chǎngjiā tíqián yìxiē jiāohuò?","r":"Господин Ли, своевременная поставка очень важна: сентябрь — сезон выхода на рынок. Можно ли убедить завод отгрузить раньше?"},"那就十月中旬吧，我们不着急。":{"p":"Nàjiù shíyuè zhōng xún ba, wǒmen bù zháojí.","r":"Тогда середина октября, мы не спешим."},"你们必须九月交货，否则我们取消订单。":{"p":"Nǐmen bìxū jiǔyuè jiāohuò, fǒuzé wǒmen qǔxiāo dìngdān.","r":"Вы обязаны поставить в сентябре, иначе отменим заказ."},"我明白。那能不能在上海装船，到香港转船，这样可以赶上旺季？":{"p":"Wǒ míng bái. nà néng bu néng zài shànghǎi zhuāngchuán, dào xiānggǎng zhuǎnchuán, zhèyàng kěyǐ gǎn shàng wàngjì?","r":"Понимаю. А можно погрузить в Шанхае и перегрузить в Гонконге, чтобы успеть к сезону?"},"不改港口就别想让我们订货了。":{"p":"Bù gǎi gǎngkǒu jiù bié xiǎng ràng wǒmen dìnghuò le.","r":"Если порт не изменить, о заказе и речи нет."},"那就算了，我们的货十月再说吧，赶不上旺季也没关系，我们不着急销售。":{"p":"Nàjiù suàn le, wǒmen de huò shíyuè zàishuō ba, gǎnbushàng wàngjì yě méi guānxi, wǒmen bù zháojí xiāoshòu.","r":"Тогда забудьте, товар — в октябре, пропустим сезон — не беда, мы не спешим с продажей."},"适时交货对我们关系可太大了，请您务必帮忙。":{"p":"Shìshí jiāohuò duì wǒmen guānxi kě tài dà le, qǐngnín wù bì bāng máng.","r":"Своевременная поставка для нас крайне важна, прошу обязательно помочь."},"你们延迟交货，损失全由你们负责，我们要追究责任！":{"p":"Nǐmen yán chí jiāohuò, sǔnshī quán yóu nǐmen fùzé, wǒmen yào zhuījiū zérèn!","r":"Если задержите поставку, весь ущерб ваш, мы будем взыскивать!"},"交货时间随便，你们什么时候方便就什么时候发。":{"p":"Jiāohuò shíjiān suíbiàn, nǐmen shénme shíhou fāng biàn jiù shénme shíhou fā.","r":"Срок поставки любой, отправляйте, когда удобно."},"恐怕纸板箱不够结实。货物要在圣彼得堡转运，潮气和雨水可能渗进去。":{"p":"Kǒngpà zhǐbǎnxiāng búgòu jiēshi. huòwù yào zài shèngbǐdébǎo zhuǎnyùn, cháoqì hé yǔshuǐ kěnéng shènjìnqu.","r":"Боюсь, картонные коробки недостаточно прочные. Товар перегружают в Санкт-Петербурге, возможно проникновение сырости и дождя."},"纸箱没问题，包装怎样都行，我们不在乎。":{"p":"Zhǐxiāng méi wèntí, bāozhuāng zěn yàng dōu xíng, wǒmen búzàihū.","r":"С картоном всё нормально, упаковка любая, нам всё равно."},"纸箱太丑了，不能吸引买主，请你们换成更结实的金属箱，费用由我们承担。":{"p":"Zhǐxiāng tài chǒu le, bù néng xīyǐn mǎizhǔ, qǐng nǐmen huàn chéng gèng jiēshi de jīnshǔ xiāng, fèiyòng yóu wǒmen chéngdān.","r":"Картонные коробки некрасивы и не привлекут покупателей; замените на прочные металлические, расходы — на нас."},"但在出现损坏或盗窃时，恐怕保险公司会借口包装不善而拒绝赔偿，我们不想冒险。":{"p":"Dàn zài chūxiàn sǔnhuài huò dàoqiè shí, kǒngpà bǎoxiǎn gōngsī huì jièkǒu bāozhuāng bú shàn ér jùjué péicháng, wǒmen bùxiǎng màoxiǎn.","r":"Но при повреждении или краже страховая может сослаться на плохую упаковку и отказать в выплате; мы не хотим рисковать."},"既然纸箱里面有防水塑料布，我们就完全放心了，包装问题到此为止，谢谢你们的解释。":{"p":"Jìrán zhǐxiāng lǐmiàn yǒu fángshuǐ sùliàobù, wǒmen jiù wánquán fàngxīn le, bāozhuāng wèntí dào cǐ wéizhǐ, xièxie nǐmen de jiěshì.","r":"Раз внутри в коробке водонепроницаемая плёнка, мы совершенно спокойны; вопрос упаковки закрыт, спасибо за объяснение."},"保险公司的事跟包装没有关系，我们不用担心这个，赔偿问题也跟你们无关，对吧？":{"p":"Bǎoxiǎn gōngsī de shì gēn bāozhuāng méiyǒu guānxi, wǒmen búyòng dānxīn zhègè, péicháng wèntí yě gēn nǐmen wúguān, duìba?","r":"Страховая не связана с упаковкой, нам не о чем беспокоиться, и возмещение вас не касается, верно?"},"精美的包装更有助于推销，希望你们注意这一点。":{"p":"Jīngměi de bāozhuāng gèng yǒu zhù yú tuīxiāo, xīwàng nǐmen zhùyì zhè yìdiǎn.","r":"Красивая упаковка помогает продажам, обратите на это внимание."},"你们的包装一向很差，必须改进。":{"p":"Nǐmen de bāozhuāng yíxiàng hěn chā, bìxū gǎi jìn.","r":"Ваша упаковка всегда плохая, её нужно улучшить."},"包装无所谓，只要便宜就行。":{"p":"Bāozhuāng wúsuǒwèi, zhǐyào piányi jiùxíng.","r":"Упаковка неважна, лишь бы было дёшево."},"这是我的公务护照，里面有一次性入境签证，在有效期内。":{"p":"Zhèshì wǒ de gōngwù hùzhào, lǐmiàn yǒu yícìxìng rùjìng qiānzhèng, zài yǒuxiàoqī nèi.","r":"Это мой служебный паспорт, в нём однократная въездная виза, срок действия не истёк."},"护照在行李箱里，请您等一会儿，我去找，签证应该也在那里面。":{"p":"Hùzhào zài xínglǐ xiāng lǐ, qǐngnín děng yíhuìr, wǒ qù zhǎo, qiānzhèng yīnggāi yě zài nà lǐmiàn.","r":"Паспорт в чемодане, подождите, я поищу; виза, должно быть, тоже там."},"我没有签证，到了中国再办吧，反正你们公司会安排好所有手续。":{"p":"Wǒ méiyǒu qiānzhèng, dào le zhōngguó zài bàn ba, fǎnzhèng nǐmen gōngsī huì ānpái hǎo suǒ yǒu shǒuxù.","r":"Визы у меня нет, оформлю в Китае, ваша компания всё равно уладит формальности."},"附上了。提单、装箱单、发票和进口许可证都齐全。":{"p":"Fùshàng le. tídān, zhuāngxiāngdān, fāpiào hé jìnkǒu xǔkězhèng dōu qíquán.","r":"Прилагается. Коносамент, упаковочный лист, счёт и импортная лицензия — всё на месте."},"只有发票，其他单据以后补交。":{"p":"Zhǐyǒu fāpiào, qítā dānjù yǐhòu bǔjiāo.","r":"Есть только счёт, остальные документы позже."},"报关单我们不填，海关自己查就行。":{"p":"Bào guān dān wǒmen bù tián, hǎiguān zìjǐ chá jiùxíng.","r":"Декларацию мы не заполняем, таможня проверит сама."},"从事对外贸易我还没多少经验，想请教您海关检查的问题。":{"p":"Cóngshì duìwài màoyì wǒ hái méi duōshǎo jīngyàn, xiǎng qǐngjiào nín hǎiguān jiǎnchá de wèntí.","r":"Опыта во внешней торговле у меня мало, прошу посоветовать по таможенному досмотру."},"海关检查太麻烦了，我们没有时间，能不能不检查，直接放行我们的货物？":{"p":"Hǎiguān jiǎnchá tài máfán le, wǒmen méiyǒu shíjiān, néng bu néng bùjiǎnchá, zhíjiē fàngxíng wǒmen de huòwù?","r":"Таможенный досмотр слишком хлопотен, времени нет; нельзя ли пропустить груз без проверки?"},"这些我都懂，我只是随便问问。":{"p":"Zhèxiē wǒ dōu dǒng, wǒ zhǐshì suíbiàn wèn wèn.","r":"Я всё это знаю, просто спросил."},"海运运量大、运费低，虽然时间长、风险大，但对大宗商品最合算。":{"p":"Hǎiyùn yùn liàng dà, yùnfèi dī, suīrán shíjiān cháng, fēngxiǎn dà, dàn duì dàzōng shāngpǐn zuì hésuàn.","r":"Морской транспорт: большой объём и низкий фрахт; хоть он долгий и рискованный, для массовых грузов выгоднее всего."},"空运最快，价格再高也值得。":{"p":"Kōngyùn zuì kuài, jiàgé zài gāo yě zhídé.","r":"Быстрее всего воздух; пусть дороже, оно того стоит."},"最好用汽车直接从上海运到莫斯科。":{"p":"Zuì hǎo yòng qìchē zhíjiē cóng shànghǎi yùn dào mòsīkē.","r":"Лучше всего грузовиком прямо из Шанхая в Москву."},"班轮运输和租船运输。":{"p":"Bānlún yùnshū hé zūchuán yùnshū.","r":"Линейное и чартерное судоходство."},"干货船和油槽船两大类。":{"p":"Gānhuò chuán hé yóucáochuán liǎng dà lèi.","r":"Два больших класса: сухогрузы и танкеры."},"直运和转运。":{"p":"Zhíyùn hé zhuǎnyùn.","r":"Прямая перевозка и перевозка с перегрузкой."},"我在安排外贸运输方面真是个外行，希望您多多指教。":{"p":"Wǒ zài ānpái wài mào yùnshū fāng miàn zhēn shì gè wàixíng, xīwàng nín duō duō zhǐjiào.","r":"В организации внешнеторговых перевозок я настоящий новичок, прошу вас учить меня."},"运输是你们的事，我不想了解，你们安排好了告诉我结果就行。":{"p":"Yùnshū shì nǐmen de shì, wǒ bùxiǎng liǎojiě, nǐmen ānpái hǎo le gàosù wǒ jié guǒ jiùxíng.","r":"Перевозка — ваше дело, мне знать не нужно: организуйте и сообщите результат."},"我对运输很在行，不用你介绍，我们自己安排就可以了。":{"p":"Wǒ duì yùnshū hěn zài xíng, búyòng nǐ jièshào, wǒmen zìjǐ ānpái jiù kěyǐ le.","r":"Я хорошо разбираюсь в перевозках, объяснять не надо, организуем сами."},"我明白了，我们不借用名牌商标。如果设计新商标，注册大约要多长时间？":{"p":"Wǒ míngbai le, wǒmen bú jièyòng míngpái shāngbiāo. rúguǒ shèjì xīn shāngbiāo, zhùcè dàyuē yào duōcháng shíjiān?","r":"Понятно, чужой известный бренд брать не будем. Сколько займёт регистрация нового товарного знака?"},"只是借用一点内容，不算假冒，你们太敏感了，其他公司都是这样做的。":{"p":"Zhǐshì jièyòng yìdiǎn nèi róng, bú suàn jiǎmào, nǐmen tài mǐn gǎn le, qítā gōngsī dōushì zhèyàng zuò de.","r":"Мы просто берём немного, это не подделка; вы слишком чувствительны, так делают все."},"那我们不管商标，直接在俄罗斯卖。":{"p":"Nà wǒmen bùguǎn shāngbiāo, zhíjiē zài éluósī mài.","r":"Тогда оставим знак в стороне и будем продавать в России напрямую."},"三个月太长，会赶不上销售旺季。我们还是用你们的品牌吧，使用费由谁负担？":{"p":"Sān gè yuè tài cháng, huì gǎnbushàng xiāoshòu wàngjì. wǒmen háishi yòng nǐmen de pǐnpái ba, shǐ yòng fèi yóu shéi fùdān?","r":"Три месяца — слишком долго, не успеем к сезону. Лучше пользоваться вашим брендом; кто платит за использование?"},"三个月没关系，销售旺季不重要，我们可以慢慢等你们办完注册手续。":{"p":"Sān gè yuè méi guānxi, xiāoshòu wàngjì bú zhòngyào, wǒmen kěyǐ mànmàn děng nǐmen bàn wán zhùcè shǒuxù.","r":"Три месяца — не беда, сезон неважен, спокойно подождём, пока вы завершите регистрацию."},"我们先用，注册的事以后再说，反正也没有人会发现我们没有注册。":{"p":"Wǒmen xiān yòng, zhùcè de shì yǐhòu zàishuō, fǎnzhèng yě méiyǒu rén huì fāxiàn wǒmen méiyǒu zhùcè.","r":"Сначала используем, регистрация потом; всё равно никто не заметит, что её нет."},"还有一个问题，我们要不要支付你们商标的使用费？":{"p":"Háiyǒu yí gè wèntí, wǒmen yào bu yào zhīfù nǐmen shāngbiāo de shǐ yòng fèi?","r":"Ещё вопрос: нужно ли платить вам за использование товарного знака?"},"商标的使用费应该由你们出，对吧？":{"p":"Shāngbiāo de shǐ yòng fèi yīnggāi yóu nǐmen chū, duìba?","r":"Плата за использование знака должна быть на вас, верно?"},"你们不会收我们商标使用费吧？":{"p":"Nǐmen búhuì shōu wǒmen shāngbiāo shǐ yòng fèi ba?","r":"Вы ведь не будете брать с нас плату за знак?"},"请把保险单拿来看看，具体承保哪些险别，责任范围写在哪里？":{"p":"Qǐng bǎ bǎoxiǎndān ná lái kànkàn, jùtǐ chéngbǎo nǎ xiē xiǎnbié, zérèn fàn wéi xiě zài nǎ lǐ?","r":"Покажите, пожалуйста, страховой полис: какие риски покрываются и где прописана ответственность?"},"我们不看保险单，反正损失必须赔，请你们尽快把赔偿金额告诉我们。":{"p":"Wǒmen bú kàn bǎoxiǎndān, fǎnzhèng sǔnshī bìxū péi, qǐng nǐmen jǐnkuài bǎ péicháng jīn'é gàosù wǒmen.","r":"Полис смотреть не будем, убыток всё равно обязаны возместить; скорее назовите сумму компенсации."},"不用看保险单，我们已经认可了，请你们直接说怎么处理这批货吧。":{"p":"Búyòng kàn bǎoxiǎndān, wǒmen yǐjīng rèn kě le, qǐng nǐmen zhíjiē shuō zěnme chǔlǐ zhè pī huòba.","r":"Полис смотреть не нужно, мы уже согласились; просто скажите, что делать с этой партией."},"为避免今后再发生这类问题，建议合同和信用证中明确写明投保的险别，包括破碎险。":{"p":"Wèi bìmiǎn jīn hòu zài fā shēng zhè lèi wèntí, jiànyì hétóng hé xìnyòngzhèng zhōng míngquè xiě míng tóubǎo de xiǎnbié, bāokuò pòsuìxiǎn.","r":"Чтобы такого больше не повторилось, предлагаем чётко прописать в контракте и аккредитиве страхуемые риски, включая бой."},"下次信用证不用写这么细，写综合海运险就行。":{"p":"Xiàcì xìnyòngzhèng búyòng xiě zhème xì, xiě zōnghé hǎiyùn xiǎn jiùxíng.","r":"В следующий раз в аккредитиве так подробно писать не надо, достаточно «полная морская страховка»."},"以后保险全由你们办理，我们不再过问。":{"p":"Yǐhòu bǎoxiǎn quán yóu nǐmen bàn lǐ, wǒmen bú zài guò wèn.","r":"Дальше страховку полностью оформляете вы, нас она не касается."},"请张先生解释一下保险公司拒绝赔偿的理由，好吗？":{"p":"Qǐng zhāng xiānsheng jiěshì yíxià bǎoxiǎn gōngsī jùjué péicháng de lǐ yóu, hǎo ma?","r":"Господин Чжан, объясните, пожалуйста, причину отказа страховой в выплате?"},"你们保险公司为什么拒绝赔偿？是不是根本就不想赔？请马上回答。":{"p":"Nǐmen bǎoxiǎn gōngsī wèi shénme jùjué péicháng? shì bu shì gēnběn jiù bùxiǎng péi? qǐng mǎshàng huídá.","r":"Почему ваша страховая отказала? Они вообще не хотят платить? Отвечайте немедленно."},"保险公司的解释我们不想听。":{"p":"Bǎoxiǎn gōngsī de jiěshì wǒmen bùxiǎng tīng.","r":"Объяснения страховой слушать не хотим."},"我方的建议是：各种尺寸的皮鞋每年销售五万双，业务地区是整个俄罗斯市场，我们希望有百分之五的佣金。":{"p":"Wǒfāng de jiànyì shì: gè zhǒng chǐcùn de píxié měinián xiāoshòu wǔ wàn shuāng, yèwu dìqū shì zhěng gè éluósī shìchǎng, wǒmen xīwàng yǒu bǎi fēn zhī wǔ de yòngjīn.","r":"Наше предложение: обувь всех размеров, 50 тысяч пар в год, территория — весь российский рынок; хотим комиссию 5%."},"订货量不是问题，请直接签独家代理协议。":{"p":"Dìnghuòliàng búshì wèntí, qǐng zhíjiē qiān dújiā dàilǐ xiéyì.","r":"Объём заказов не проблема, подписывайте эксклюзивное агентское соглашение."},"那我们不做代理了，改做你们的竞争对手。":{"p":"Nà wǒmen bú zuò dàilǐ le, gǎi zuò nǐmen de jìngzhēng duì shǒu.","r":"Тогда агентами мы не будем, станем вашими конкурентами."},"好，请把你们对订货量和佣金的要求写进协议。":{"p":"Hǎo, qǐng bǎ nǐmen duì dìnghuòliàng hé yòngjīn de yào qiú xiě jìn xiéyì.","r":"Хорошо, впишите ваши требования по объёму и комиссии в соглашение."},"订货量我们先不承诺，先签协议再说，以后有机会再慢慢谈。":{"p":"Dìnghuòliàng wǒmen xiān bù chéngnuò, xiān qiān xiéyì zàishuō, yǐhòu yǒu jī huì zài mànmàn tán.","r":"Объём пока не обещаем: сначала соглашение, потом когда-нибудь спокойно обсудим."},"三年太长，我们只签一个月。":{"p":"Sānnián tài cháng, wǒmen zhǐ qiān yí gè yuè.","r":"Три года — долго, подпишем только на месяц."},"我们做生意向来谨慎从事，说到做到。":{"p":"Wǒmen zuòshēngyì xiànglái jǐnshèn cóngshì, shuōdào zuòdào.","r":"В делах мы всегда осторожны и держим слово."},"我们说话一向算数，不过有时候也可能做不到。":{"p":"Wǒmen shuō huà yíxiàng suàn shù, búguò yǒu shíhou yě kěnéng zuòbudào.","r":"Мы всегда держим слово, но иногда можем и не выполнить."},"你们这样不相信我们，那我们就不再谈这件事了。":{"p":"Nǐmen zhèyàng bùxiāngxìn wǒmen, nà wǒmen jiù bú zài tán zhè jiàn shì le.","r":"Раз вы нам не доверяете, этот вопрос обсуждать не будем."},"损坏是在装船之前发生的。这是莫斯科卫生检疫所官员签发的证书，上面写得一清二楚。":{"p":"Sǔnhuài shì zài zhuāngchuán zhīqián fā shēng de. zhèshì mòsīkē wèishēng jiǎnyì suǒ guānyuán qiānfā de zhèngshū, shàng miàn xiě de yìqīng èrchǔ.","r":"Повреждение произошло до погрузки. Вот сертификат, выданный чиновником карантинной службы Москвы, всё написано ясно."},"原因我们现在不清楚，但货是你们发的，到了我们这里就坏了，所以当然应该由你们来赔。":{"p":"Yuányīn wǒmen xiànzài bù qīng chǔ, dàn huò shì nǐmen fā de, dào le wǒmen zhè lǐ jiù huài le, suǒyǐ dāngrán yīnggāi yóu nǐmen lái péi.","r":"Причина нам сейчас неясна, но товар отправили вы, к нам пришёл испорченным, поэтому, конечно, платить вам."},"可能是运输途中的问题，我们先查查船公司。":{"p":"Kěnéng shì yùnshū tú zhōng de wèntí, wǒmen xiān chá chá chuán gōngsī.","r":"Возможно, проблема в пути, сначала проверим судоходную компанию."},"好的，我们可以提供检验证书和损失清单，请贵方核实后再确定赔偿金额。":{"p":"Hǎo de, wǒmen kěyǐ tígōng jiǎn yànzhèngshū hé sǔnshī qīngdān, qǐng guìfāng hé shí hòu zài quèdìng péicháng jīn'é.","r":"Хорошо, мы можем представить акт экспертизы и перечень убытков; после вашей проверки определим сумму."},"百分之四十一分也不能少，否则我们就要诉诸法院，没有什么好谈的。":{"p":"Bǎi fēn zhī sì shíyī fēn yě bù néng shǎo, fǒuzé wǒmen jiùyào sù zhū fǎ yuàn, méiyǒu shénme hǎo tán de.","r":"Ни на одну сотую меньше, иначе пойдём в суд, и говорить не о чем."},"那就由你们说多少算多少吧，我们不会再核实，也不想再争论这件事了。":{"p":"Nàjiù yóu nǐmen shuō duōshǎo suàn duōshǎo ba, wǒmen búhuì zài hé shí, yě bùxiǎng zài zhēng lùn zhè jiàn shì le.","r":"Сколько скажете, столько и будет, проверять больше не станем и спорить не хотим."},"对此我们感到十分遗憾，但我们必须向您提出索赔。":{"p":"Duì cǐ wǒmen gǎndào shífēn yíhàn, dàn wǒmen bìxū xiàng nín tíchū suǒpéi.","r":"Нам очень жаль, но мы должны предъявить вам претензию."},"你们公司的货出了问题，这件事你们必须负责！":{"p":"Nǐmen gōngsī de huò chū le wèntí, zhè jiàn shì nǐmen bìxū fùzé!","r":"С товаром вашей компании проблема — вы обязаны ответить!"},"不好意思，打扰了，其实也没什么大问题。":{"p":"Bù hǎoyìsi, dǎrǎo le, qí shí yě méi shénme dà wèntí.","r":"Извините, что побеспокоил, на самом деле ничего серьёзного."},"欢迎。我们可以转让许可证，不过首先要向俄罗斯主管部门申请售证权，批准后才能开始谈判。":{"p":"Huānyíng. wǒmen kěyǐ zhuǎnràng xǔkězhèng, búguò shǒuxiān yào xiàng éluósī zhǔguǎn bùmén shēnqǐng shòu zhèng quán, pīzhǔn hòu cáinéng kāishǐ tánpàn.","r":"Добро пожаловать. Лицензию передать можем, но сначала нужно подать заявку российским органам на право продажи; после одобрения начнём переговоры."},"没问题，明天就可以签合同，许可证随时都可以给您，不需要任何主管部门批准，您尽管放心。":{"p":"Méi wèntí, míngtiān jiù kěyǐ qiān hétóng, xǔkězhèng suíshí dōu kěyǐ gěi nín, bù xūyào rèn hé zhǔguǎn bùmén pīzhǔn, nín jǐn guǎn fàngxīn.","r":"Без проблем, завтра подпишем контракт, лицензия — в любой момент, одобрения не нужны, не беспокойтесь."},"我们不转让许可证，只出售成品飞机，如果贵方有兴趣，可以考虑购买整架飞机，不过价格较高。":{"p":"Wǒmen bù zhuǎnràng xǔkězhèng, zhǐ chūshòu chéngpǐn fēijī, rúguǒ guìfāng yǒu xìng qù, kěyǐ kǎolǜ gòumǎi zhěng jià fēijī, búguò jiàgé jiào gāo.","r":"Лицензию не передаём, продаём только готовые самолёты; если интересно, можно купить целый самолёт, но цена выше."},"您说得对，只要开了头，后面就会顺利些。":{"p":"Nín shuōde duì, zhǐyào kāi le tóu, hòu miàn jiù huì shùn lì xiē.","r":"Вы правы, лишь бы начать, потом пойдёт легче."},"那我们别开头了，太难。":{"p":"Nà wǒmen bié kāi tóu le, tài nán.","r":"Тогда не будем начинать, слишком трудно."},"这不是俗话，是借口。":{"p":"Zhè búshì sú huà, shì jièkǒu.","r":"Это не поговорка, а отговорка."},"哪里，我们还要向中国学习很多东西。":{"p":"Nǎ lǐ, wǒmen hái yào xiàng zhōngguó xué xí hěn duō dōngxi.","r":"Что вы, нам ещё многому надо учиться у Китая."},"那当然，我们的航空航天工业确实远远超过其他国家。":{"p":"Nà dāngrán, wǒmen de hángkōng hángtiān gōng yè quèshí yuǎnyuǎn chāoguò qítā guó jiā.","r":"Конечно, наша авиакосмическая отрасль намного превосходит другие страны."},"中国高科技根本比不上。":{"p":"Zhōngguó gāo kē jì gēnběn bǐbushàng.","r":"Китайским высоким технологиям до этого совсем далеко."},"这些问题我们当场不好回答，现在只是意向性探讨。我认为先请专家研究，编制项目的可行性报告。":{"p":"Zhèxiē wèntí wǒmen dāngchǎng bù hǎo huídá, xiànzài zhǐshì yìxiàng xìng tàntǎo. wǒ rènwéi xiān qǐng zhuānjiā yánjiū, biānzhì xiàng mùdi kěxíngxìng bàogào.","r":"На эти вопросы сразу не ответить, сейчас лишь предварительное обсуждение. Думаю, сначала пусть изучат эксперты и составят технико-экономическое обоснование проекта."},"我们的工厂条件都很好，年产量几万台，不用调查了。":{"p":"Wǒmen de gōngchǎng tiáojiàn dōu hěn hǎo, nián chǎn liàng jǐ wàn tái, búyòng diào chá le.","r":"У наших заводов условия отличные, годовой выпуск — десятки тысяч штук, изучать не нужно."},"这些问题与许可证无关，我们不想回答。":{"p":"Zhèxiē wèntí yǔ xǔkězhèng wúguān, wǒmen bùxiǎng huídá.","r":"Эти вопросы к лицензии не относятся, отвечать не хотим."},"欢迎。我们会安排接待，并先提供厂房和设备的基本资料。":{"p":"Huānyíng. wǒmen huì ānpái jiēdài, bìng xiān tígōng chǎngfáng hé shèbèi de jī běn zīliào.","r":"Добро пожаловать. Организуем приём и сначала предоставим базовые данные о цехах и оборудовании."},"不用派专家，你们直接给报价就行，我们不需要实地考察，也不会提供资料。":{"p":"Búyòng pài zhuānjiā, nǐmen zhíjiē gěi bàojià jiùxíng, wǒmen bù xūyào shí dì kǎochá, yě búhuì tígōng zīliào.","r":"Экспертов присылать не нужно, просто дайте цену: выезд на место нам не нужен, материалов не дадим."},"请你们先付一笔钱，再派专家来。":{"p":"Qǐng nǐmen xiān fù yì bǐ qián, zài pài zhuānjiā lái.","r":"Сначала заплатите нам сумму, потом присылайте экспертов."},"我们两个公司之间的贸易额不断增长，合作范围也在扩大，我们感到很高兴。":{"p":"Wǒmen liǎng gè gōngsī zhījiān de màoyì é búduàn zēngcháng, hézuò fànwéi yě zài kuòdà, wǒmen gǎndào hěn gāoxìng.","r":"Торговый оборот между нашими компаниями растёт, сотрудничество расширяется — нам очень приятно."},"你们的订货还是太少，我们希望你们明年大幅增加订货量，否则很难维持合作关系。":{"p":"Nǐmen de dìnghuò háishi tài shǎo, wǒmen xīwàng nǐmen míng nián dà fú zēngjiā dìnghuòliàng, fǒuzé hěn nán wéi chí hézuò guānxi.","r":"Заказов у вас всё ещё мало; в будущем году значительно увеличьте, иначе поддерживать сотрудничество трудно."},"合作倒是还行，但是我们也不太满意，希望今后你们在各个方面都能做得更好一些。":{"p":"Hézuò dào shì hái xíng, dànshì wǒmen yě bútài mǎnyì, xīwàng jīn hòu nǐmen zài gè gè fāng miàn dōu néng zuò de gèng hǎo yìxiē.","r":"Сотрудничество в целом нормальное, но мы не очень довольны; надеемся, дальше вы будете лучше во всём."},"没关系，请转达我们对王主任的问候。":{"p":"Méi guānxi, qǐng zhuǎndá wǒmen duì wáng zhǔrèn de wènhòu.","r":"Ничего страшного, передайте наш привет директору Вану."},"他为什么不来？我们是专程来的，这样安排实在不太合适。":{"p":"Tā wèi shénme bù lái? wǒmen shì zhuānchéng lái de, zhèyàng ānpái shízài bútài héshì.","r":"Почему он не приехал? Мы приехали специально, такая организация неуместна."},"那我们先回饭店，改天再见面吧，等王主任有空了再联系我们。":{"p":"Nà wǒmen xiān huí fàndiàn, gǎi tiān zàijiàn miàn ba, děng wáng zhǔrèn yǒu kōng le zài liánxì wǒmen.","r":"Тогда мы вернёмся в гостиницу, встретимся в другой день, свяжитесь, когда у директора Вана будет время."},"谢谢邀请，我们感到十分荣幸，明晚一定准时到。":{"p":"Xièxie yāoqǐng, wǒmen gǎndào shífēn róngxìng, míng wǎn yídìng zhǔn shí dào.","r":"Спасибо за приглашение, это большая честь, завтра вечером точно придём вовремя."},"谢谢，请帖我收下了，不过我们不一定去。":{"p":"Xièxie, qǐngtiě wǒ shōu xià le, búguò wǒmen bù yídìng qù.","r":"Спасибо, приглашение принимаю, но мы не обязательно придём."},"谢谢，吃饭就不去了，我们想早点儿谈生意。":{"p":"Xièxie, chī fàn jiù bú qù le, wǒmen xiǎng zǎo diǎnr tán shēngyì.","r":"Спасибо, на ужин не пойдём, хотим скорее перейти к делу."},"我对你们的日用轻工产品有兴趣，希望你们报一个到圣彼得堡的CIF价格。":{"p":"Wǒ duì nǐmen de rì yòng qīnggōng chǎnpǐn yǒu xìng qù, xīwàng nǐmen bào yí gè dào shèngbǐdébǎo de CIF jiàgé.","r":"Меня интересуют ваши товары лёгкой промышленности; назовите цену CIF до Санкт-Петербурга."},"我对所有产品都有兴趣，请你们把全部产品的价格都告诉我，我回去慢慢选。":{"p":"Wǒ duì suǒ yǒu chǎnpǐn dōuyǒu xìng qù, qǐng nǐmen bǎ quánbù chǎnpǐn de jiàgé dōu gàosù wǒ, wǒ huí qù mànmàn xuǎn.","r":"Меня интересуют все товары, сообщите цены на всё, дома я спокойно выберу."},"我只是来参观的，不打算订货，也不用报价。":{"p":"Wǒ zhǐshì lái cānguān de, bù dǎ suàn dìnghuò, yě búyòng bàojià.","r":"Я только осматриваюсь, заказывать не собираюсь, цена не нужна."},"我们用不着这么长的时间，价格优惠的话我马上可以订货。":{"p":"Wǒmen yòngbuzháo zhème cháng de shíjiān, jiàgé yōuhuì de huà wǒ mǎshàng kěyǐ dìnghuò.","r":"Столько времени нам не нужно; если цена выгодная, закажу сразу."},"三天太短，我们至少要一个月才能决定，请你们把报价改成一个月有效。":{"p":"Sāntiān tài duǎn, wǒmen zhìshǎo yào yí gè yuè cáinéng juédìng, qǐng nǐmen bǎ bàojià gǎi chéng yí gè yuè yǒuxiào.","r":"Три дня мало, нам нужен минимум месяц; сделайте предложение действительным месяц."},"我们不会订货，只是随便问问价格，你们不用这么认真地准备报价。":{"p":"Wǒmen búhuì dìnghuò, zhǐshì suíbiàn wèn wèn jiàgé, nǐmen búyòng zhème rènzhēn de zhǔnbèi bàojià.","r":"Заказывать не будем, цену просто узнаём; не нужно так серьёзно готовить предложение."},"我们很了解行情。不过按这个价格买进，我方实在难以推销，希望你们作出一些让步。":{"p":"Wǒmen hěn liǎojiě hángqíng. búguò àn zhègè jiàgé mǎijìn, wǒfāng shízài nányǐ tuīxiāo, xīwàng nǐmen zuòchū yìxiē ràngbù.","r":"Мы хорошо знаем рынок. Но по такой цене нам трудно продавать, прошу пойти на уступки."},"你们说的我完全同意，价格不用再谈了。":{"p":"Nǐmen shuō de wǒ wánquán tóngyì, jiàgé búyòng zài tán le.","r":"Полностью согласен со сказанным, цену больше не обсуждаем."},"行情都是你们编的，我们不相信。":{"p":"Hángqíng dōushì nǐmen biān de, wǒmen bùxiāngxìn.","r":"Рынок вы придумали, мы не верим."},"订货数量在很大程度上取决于价格。如果你们减价百分之五，我们可以多订。":{"p":"Dìnghuò shùliàng zài hěn dà chéng dù shàng qǔjuéyú jiàgé. rúguǒ nǐmen jiǎnjià bǎi fēn zhī wǔ, wǒmen kěyǐ duō dìng.","r":"Объём заказа во многом зависит от цены. Снизите на 5% — закажем больше."},"数量我们还没想好，你们先减价再说，减得多我们就多订，减得少就少订。":{"p":"Shùliàng wǒmen hái méi xiǎng hǎo, nǐmen xiān jiǎnjià zàishuō, jiǎn de duō wǒmen jiù duō dìng, jiǎn de shǎo jiù shǎo dìng.","r":"Количество пока не решили: сначала снизьте цену; больше скидка — больше заказ."},"我们订多少与你们的价格无关。":{"p":"Wǒmen dìng duōshǎo yǔ nǐmen de jiàgé wúguān.","r":"Сколько закажем — от вашей цены не зависит."},"我们理解，不过开证要付押金和手续费。能否货价的一半用信用证，其余付款交单？":{"p":"Wǒmen lǐjiě, búguò kāizhèng yào fù yājīn hé shǒuxùfèi. néngfǒu huòjià de yíbàn yòng xìnyòngzhèng, qí yú fùkuǎn jiāodān?","r":"Понимаем, но за открытие аккредитива берут залог и комиссию. Можно половину стоимости аккредитивом, остальное — документы против платежа?"},"信用证我们一定不用，别的方式都行，包括承兑交单或者付款交单，请你们再考虑一下。":{"p":"Xìnyòngzhèng wǒmen yídìng búyòng, bié de fāngshì dōu xíng, bāokuò chéngduì jiāodān huòzhě fùkuǎn jiāodān, qǐng nǐmen zài kǎolǜ yíxià.","r":"Аккредитив ни за что, другие способы подойдут, включая документы против акцепта или платежа; подумайте ещё."},"好，一切按你们的要求办，我们不再讨论付款方式，请你们尽快把合同寄给我们吧。":{"p":"Hǎo, yíqiè àn nǐmen de yào qiú bàn, wǒmen bú zài tǎo lùn fùkuǎn fāngshì, qǐng nǐmen jǐnkuài bǎ hétóng jì gěi wǒmen ba.","r":"Хорошо, всё по вашим требованиям, способ оплаты больше не обсуждаем; скорее пришлите контракт."},"好吧，我不削减订单。我回去马上开立信用证，请你们收到后立即发货。":{"p":"Hǎoba, wǒ bù xuējiǎn dìngdān. wǒ huí qù mǎshàng kāilì xìnyòngzhèng, qǐng nǐmen shōudào hòu lìjí fāhuò.","r":"Ладно, заказ не сокращаю. Вернусь, сразу открою аккредитив, по получении сразу отгружайте."},"那这笔生意就算了，我们不订了。":{"p":"Nà zhè bǐ shēngyì jiù suàn le, wǒmen bú dìng le.","r":"Тогда сделку отменим, заказывать не будем."},"我们先削减一半订单，信用证以后再开。":{"p":"Wǒmen xiān xuējiǎn yíbàn dìngdān, xìnyòngzhèng yǐhòu zài kāi.","r":"Сначала сократим заказ вдвое, аккредитив — потом."},"交货时间对我们关系很大，请您和厂家联系，看能否提前。":{"p":"Jiāohuò shíjiān duì wǒmen guānxi hěn dà, qǐngnín hé chǎngjiā liánxì, kàn néngfǒu tíqián.","r":"Срок поставки для нас очень важен, свяжитесь с заводом: нельзя ли раньше?"},"那十月中旬就十月中旬，我们不管销售季节了，反正货物晚到也可以卖。":{"p":"Nà shíyuè zhōng xún jiù shíyuè zhōng xún, wǒmen bùguǎn xiāoshòu jìjié le, fǎnzhèng huòwù wǎn dào yě kěyǐ mài.","r":"Ладно, середина октября, сезон не учитываем, товар всё равно можно продать позже."},"排满了也得交，我们公司是老客户。":{"p":"Pái mǎn le yě děi jiāo, wǒmen gōngsī shì lǎo kèhù.","r":"Даже если график забит, поставьте: мы давний клиент."},"货要在圣彼得堡转运，恐怕纸箱受不了潮气，请考虑防潮包装。":{"p":"Huò yào zài shèngbǐdébǎo zhuǎnyùn, kǒngpà zhǐxiāng shòubuliǎo cháoqì, qǐng kǎolǜ fángcháo bāozhuāng.","r":"Товар перегружают в Санкт-Петербурге; боюсь, коробки не выдержат сырость, подумайте о влагозащитной упаковке."},"纸箱最好，我们不需要任何防潮措施，请你们按原来的办法包装就可以了。":{"p":"Zhǐxiāng zuì hǎo, wǒmen bù xūyào rèn hé fángcháo cuòshī, qǐng nǐmen àn yuán lái de bànfa bāozhuāng jiù kěyǐ le.","r":"Картон лучший, влагозащита не нужна, упаковывайте как раньше."},"你们的包装都不行，我们自己包装，请你们把货物原样交给我们的代表。":{"p":"Nǐmen de bāozhuāng dōubù xíng, wǒmen zìjǐ bāozhuāng, qǐng nǐmen bǎ huòwù yuán yàng jiāo gěi wǒmen de dài biǎo.","r":"Ваша упаковка вся плохая, упакуем сами; отдайте товар нашему представителю как есть."},"如果没有信用证作担保，我们很难融资。能否通过第三国银行申请贷款？这只是我们的建议。":{"p":"Rúguǒ méiyǒu xìnyòngzhèng zuò dānbǎo, wǒmen hěn nán róngzī. néngfǒu tōngguò dì sān guó yínháng shēnqǐng dàikuǎn? zhè zhǐshì wǒmen de jiànyì.","r":"Без гарантии аккредитива нам трудно получить финансирование. Можно ли взять кредит в банке третьей страны? Это только наш атериалы?"},"我们不想注册，直接使用。":{"p":"Wǒmen bùxiǎng zhùcè, zhíjiē shǐ yòng.","r":"Регистрировать не хотим, будем пользоваться напрямую."},"注册太麻烦，我们仿造一个类似的商标，这样就不用向有关部门申请了。":{"p":"Zhùcè tài máfán, wǒmen fángzào yí gè lèisì de shāngbiāo, zhèyàng jiù búyòng xiàng yǒuguān bù mén shēnqǐng le.","r":"Регистрация хлопотна; сделаем похожий знак, тогда заявки в органы не нужны."},"请按合同和信用证投保水渍险，并加保破碎险。":{"p":"Qǐng àn hétóng hé xìnyòngzhèng tóubǎo shuǐzìxiǎn, bìng jiā bǎo pòsuìxiǎn.","r":"Застрахуйте по контракту и аккредитиву от частной аварии и дополнительно от боя."},"水渍险就够了，不用加保，这样保险费可以便宜一些，风险我们承担。":{"p":"Shuǐzìxiǎn jiù gòu le, búyòng jiā bǎo, zhèyàng bǎoxiǎnfèi kěyǐ piányi yìxiē, fēngxiǎn wǒmen chéngdān.","r":"Хватит частной аварии, без доплаты — страховка дешевле, риск берём на себя."},"什么险都不用保，我们自己承担，保险费太贵了，没有必要。":{"p":"Shénme xiǎn dōubù yòng bǎo, wǒmen zìjǐ chéngdān, bǎoxiǎnfèi tài guì le, méiyǒu bì yào.","r":"Страховать ничего не нужно, риск наш; страховка дорогая, ни к чему."},"我们保证每年销售五万双，业务地区是整个俄罗斯，希望有百分之五的佣金。":{"p":"Wǒmen bǎozhèng měinián xiāoshòu wǔ wàn shuāng, yèwu dìqū shì zhěng gè éluósī, xīwàng yǒu bǎi fēn zhī wǔ de yòngjīn.","r":"Гарантируем продажи 50 тысяч пар в год, территория — вся Россия, хотим комиссию 5%."},"订货量不保证，先给我们独家代理再说。":{"p":"Dìnghuòliàng bù bǎozhèng, xiān gěi wǒmen dújiā dàilǐ zàishuō.","r":"Объём не гарантируем, сначала дайте эксклюзивное агентство."},"我们不想做独家代理，要做你们的竞争者。":{"p":"Wǒmen bùxiǎng zuò dújiā dàilǐ, yào zuò nǐmen de jìngzhēng zhě.","r":"Эксклюзивными агентами быть не хотим, станем вашими конкурентами."},"这是卫生检疫所签发的证书，请贵方核实后确定赔偿金额。":{"p":"Zhèshì wèishēng jiǎnyì suǒ qiānfā de zhèngshū, qǐng guìfāng hé shí hòu quèdìng péicháng jīn'é.","r":"Вот сертификат карантинной службы, прошу проверить и определить сумму возмещения."},"不需要证明，你们的货坏了就该赔，我们说的都是事实，没有必要再检查。":{"p":"Bù xūyào zhèng míng, nǐmen de huò huài le jiù gāi péi, wǒmen shuō de dōushì shì shí, méiyǒu bì yào zài jiǎnchá.","r":"Доказательства не нужны: ваш товар испорчен, платите; мы говорим правду, проверять не надо."},"证书丢了，但我们说的都是事实。":{"p":"Zhèngshū diū le, dàn wǒmen shuō de dōushì shì shí.","r":"Сертификат потерян, но мы говорим правду."},"是的，我们有兴趣，但这只是意向性探讨，需要专家先研究并编制可行性报告。":{"p":"Shì de, wǒmen yǒu xìng qù, dàn zhè zhǐshì yìxiàng xìng tàntǎo, xūyào zhuānjiā xiān yánjiū bìng biānzhì kěxíngxìng bàogào.","r":"Да, интересуемся, но это лишь предварительное обсуждение; сначала эксперты изучат и составят технико-экономическое обоснование."},"是的，我们明天就签合同，您现在就报价吧，可行性报告和专家研究都不用了。":{"p":"Shì de, wǒmen míngtiān jiù qiān hétóng, nín xiànzài jiù bàojià ba, kěxíngxìng bàogào hé zhuānjiā yánjiū dōubù yòng le.","r":"Да, завтра подписываем контракт, назовите цену сейчас, обоснование и экспертиза не нужны."},"不，我们要买拖拉机成品，不买许可证，也不打算在俄罗斯开展任何生产。":{"p":"Bù, wǒmen yào mǎi tuōlājī chéngpǐn, bù mǎi xǔkězhèng, yě bù dǎ suàn zài éluósī kāi zhǎn rèn hé shēngchǎn.","r":"Нет, нам нужны готовые тракторы, а не лицензия, и производство в России мы не планируем."},"谢谢，一路上的接待我们十分感动。再见，请向公司同事转达我们的问候！":{"p":"Xièxie, yílùshang de jiēdài wǒmen shífēn gǎndòng. zàijiàn, qǐng xiàng gōngsī tóngshì zhuǎn dá wǒmen de wènhòu!","r":"Спасибо, мы очень тронуты приёмом в пути. До свидания, передайте привет коллегам!"},"合作的事再说，现在没时间。":{"p":"Hézuò de shì zàishuō, xiànzài méi shíjiān.","r":"О сотрудничестве потом, сейчас нет времени."},"好，再见。":{"p":"Hǎo, zàijiàn.","r":"Хорошо, до свидания."}};
</script>
<script>
(function(){
"use strict";
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; };

/* ---------- icons ---------- */
const IC = {
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  bolt:'<svg viewBox="0 0 24 24" fill="#16a34a"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg>',
  flame:'<svg viewBox="0 0 24 24" fill="#d97706"><path d="M12 2c1 4 5 5.5 5 10.5A5 5 0 0 1 7 13c0-2 1-3 2-4 .2 1.5 1 2 2 2 0-3-1-5 1-9z"/></svg>',
  path:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H14a3 3 0 0 0 0-6h-4a3 3 0 0 1 0-6h5.5"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 21.5V5.5"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6.5 8-6.5s8 2.5 8 6.5"/></svg>',
  cup:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 14v4M8 21h8M10 18h4"/></svg>',
  shuffle:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>'
};

/* ---------- vocab matching ---------- */
const FORMS = new Map();
VOCAB.forEach((v, i) => v.f.forEach(f => { if(!FORMS.has(f)) FORMS.set(f, []); FORMS.get(f).push(i); }));
const MAXLEN = Math.max(...[...FORMS.keys()].map(k => k.length));
function pickEntry(form, lessonN){
  const arr = FORMS.get(form); if(!arr) return null;
  let best = arr[0];
  for(const i of arr){ if(VOCAB[i].l === lessonN){ best = i; break; } }
  return best;
}
function segment(text, lessonN){
  const out = []; let i = 0;
  while(i < text.length){
    let hit = null;
    for(let L = Math.min(MAXLEN, text.length - i); L >= 2; L--){
      const sub = text.substr(i, L);
      if(FORMS.has(sub)){ hit = sub; break; }
    }
    if(hit){ out.push({t: hit, v: pickEntry(hit, lessonN)}); i += hit.length; }
    else { out.push({t: text[i]}); i++; }
  }
  return out;
}
function wrap(text, lessonN, active=true){
  if(!active) return esc(text);
  return segment(text, lessonN).map(s => s.v != null ? `<span class="w" data-v="${s.v}">${esc(s.t)}</span>` : esc(s.t)).join('');
}
function wordsInTexts(texts, lessons, limit){
  const found = []; const seen = new Set();
  for(const t of texts){
    const segs = segment(t, null);
    for(const s of segs){
      if(s.v == null) continue;
      // prefer an entry from the requested lessons
      const arr = FORMS.get(s.t);
      const idx = arr.find(i => lessons.includes(VOCAB[i].l));
      if(idx == null || seen.has(idx)) continue;
      seen.add(idx); found.push(idx);
    }
  }
  return found.slice(0, limit);
}

/* ---------- structure ---------- */
const NODES = [];
STAGES.forEach((st, si) => {
  for(let n = st.from; n <= st.to; n++) NODES.push({id: 'L' + n, kind: 'lesson', n, stage: si});
  NODES.push({id: 'B' + (si + 1), kind: 'boss', n: si + 1, stage: si});
});
const lessonOf = n => LESSONS.find(l => l.n === n);
const bossOf = n => BOSSES.find(b => b.stage === n);

/* ---------- state ---------- */
const KEY = 'bizzh_v1';
let S = { xp: 0, done: {}, streak: 0, last: '', seen: {}, known: {}, opened: {} };
const isOpen = n => !!(S.opened && S.opened[n]) || isDone('L' + n);
let remoteRef = null, saveTimer = null;
function today(){ const d = new Date(); return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate(); }
function loadLocal(){ try{ const r = localStorage.getItem(KEY); if(r) S = Object.assign(S, JSON.parse(r)); }catch(e){} }
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  cloudSave();
  if(remoteRef){ clearTimeout(saveTimer); saveTimer = setTimeout(async () => { try{ await remoteRef.set(S); }catch(e){} }, 800); }
}
async function initRemote(){
  try{
    if(typeof claude === 'undefined' || !claude.use) return;
    const [user, db] = await Promise.all([claude.use('user'), claude.use('db')]);
    if(!user || !db) return;
    const id = typeof user.id === 'function' ? await user.id() : user.id;
    if(!id) return;
    const ref = db.collection('data/users/' + id).doc('progress');
    const snap = await ref.get();
    const d = snap && (typeof snap.data === 'function' ? snap.data() : snap);
    if(d && typeof d.xp === 'number' && d.xp > S.xp){ S = Object.assign({xp:0,done:{},streak:0,last:'',seen:{},known:{}}, d); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} render(); }
    remoteRef = ref; save();
  }catch(e){}
}
function touchStreak(){
  const t = today();
  if(S.last === t) return;
  const y = new Date(); y.setDate(y.getDate() - 1);
  const ys = y.getFullYear() + '-' + (y.getMonth()+1) + '-' + y.getDate();
  S.streak = S.last === ys ? S.streak + 1 : 1; S.last = t;
}
function addXP(n){ S.xp += n; touchStreak(); save(); }
function isDone(id){ return !!S.done[id]; }
function unlockedIndex(){ let i = 0; while(i < NODES.length && isDone(NODES[i].id)) i++; return i; }
function levelOf(xp){ return Math.floor(xp / 100) + 1; }

/* ---------- tooltip ---------- */
let tipTimer = null;
function showTip(vi){
  const v = VOCAB[vi]; if(!v) return;
  S.seen[v.zh] = 1; save();
  const el = $('#tip');
  el.innerHTML = `<div class="z zh">${esc(v.zh)}</div><div class="r">${esc(v.ru)}</div>`;
  el.classList.add('on'); clearTimeout(tipTimer);
  tipTimer = setTimeout(() => el.classList.remove('on'), 4200);
}
document.addEventListener('click', e => {
  const w = e.target.closest && e.target.closest('.w');
  if(w){ e.stopPropagation(); showTip(+w.dataset.v); }
  else if(!e.target.closest('#tip')) $('#tip').classList.remove('on');
}, true);

/* ---------- main tabs ---------- */
let tab = 'path';
const app = $('#app');
function render(){
  if(tab === 'path') renderPath(); else if(tab === 'words') renderWords(); else renderProfile();
}
function nav(){
  const t = (k, ic, name) => `<button class="${tab===k?'on':''}" data-t="${k}">${IC[ic]}<span>${name}</span></button>`;
  return `<div class="nav">${t('path','path','Путь')}${t('words','book','Слова')}${t('me','user','Профиль')}</div>`;
}
function topbar(){
  return `<div class="top"><div class="brand">Деловой <b>китайский</b></div><div class="chips">
    <div class="chip">${IC.flame}${S.streak}</div><div class="chip">${IC.bolt}${S.xp}</div></div></div>`;
}
function bindNav(){
  app.querySelectorAll('.nav button').forEach(b => b.onclick = () => { tab = b.dataset.t; render(); window.scrollTo(0,0); });
}

function renderPath(){
  const cur = unlockedIndex();
  let html = topbar() + `<div class="rand"><button class="btn ghost" id="rnd" style="display:flex;gap:8px;align-items:center;justify-content:center">${IC.shuffle}Случайный кейс</button></div>`;
  STAGES.forEach((st, si) => {
    const nodes = NODES.filter(n => n.stage === si);
    const firstIdx = NODES.indexOf(nodes[0]);
    const locked = firstIdx > cur;
    const left = nodes.filter(n => !isDone(n.id)).length;
    html += `<div class="stage ${locked?'lock':''}"><small>Грейд ${si+1} из ${STAGES.length}</small><h2>${esc(st.name)}</h2>
      <p>${esc(st.sub)}${left ? ' · осталось уровней: ' + left : ' · пройден'}</p></div><div class="track" data-s="${si}"><svg class="line"></svg>`;
    nodes.forEach((n, k) => {
      const idx = NODES.indexOf(n);
      const state = isDone(n.id) ? 'done' : idx === cur ? 'cur' : idx > cur ? 'lock' : 'cur';
      const off = Math.round(Math.sin((k + si * 2) * 1.15) * 78);
      let inner, zh, ru;
      if(n.kind === 'lesson'){ const L = lessonOf(n.n); zh = L.zh; ru = L.ru;
        inner = state === 'done' ? IC.check : state === 'lock' ? IC.lock : String(n.n); }
      else { const B = bossOf(n.n); zh = B.zh; ru = 'Итог грейда: ' + B.title;
        inner = state === 'lock' ? IC.lock : state === 'done' ? IC.cup : IC.cup; }
      html += `<div class="node-row"><div class="node ${n.kind==='boss'?'boss':''} ${state}" data-id="${n.id}" style="left:calc(50% - 75px + ${off}px)">
        <button class="dot">${inner}</button><div class="lbl"><span class="zh">${esc(zh)}</span><span class="ru">${esc(ru)}</span></div></div></div>`;
    });
    html += `</div>`;
  });
  html += `<div style="height:20px"></div>`;
  app.innerHTML = `<div class="screen">${html}</div>` + nav();
  bindNav();
  $('#rnd').onclick = startRandom;
  app.querySelectorAll('.node').forEach(el => el.querySelector('.dot').onclick = () => {
    if(el.classList.contains('lock')) { el.classList.add('shake'); setTimeout(() => el.classList.remove('shake'), 400); return; }
    startLevel(el.dataset.id);
  });
  requestAnimationFrame(drawLines);
}
function drawLines(){
  app.querySelectorAll('.track').forEach(tr => {
    const svg = tr.querySelector('svg'); const tb = tr.getBoundingClientRect();
    const dots = [...tr.querySelectorAll('.node')].map(n => { const r = n.querySelector('.dot').getBoundingClientRect();
      return {x: r.left - tb.left + r.width/2, y: r.top - tb.top + r.height/2, done: n.classList.contains('done')}; });
    svg.setAttribute('viewBox', `0 0 ${tb.width} ${tb.height}`);
    let d1 = '', d2 = '';
    for(let i = 0; i < dots.length - 1; i++){
      const a = dots[i], b = dots[i+1], my = (a.y + b.y) / 2;
      const seg = `M${a.x},${a.y} C${a.x},${my} ${b.x},${my} ${b.x},${b.y} `;
      if(a.done) d1 += seg; else d2 += seg;
    }
    svg.innerHTML = `<path d="${d2}" fill="none" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round" stroke-dasharray="1 14"/>
      <path d="${d1}" fill="none" stroke="#86efac" stroke-width="8" stroke-linecap="round"/>`;
  });
}
window.addEventListener('resize', () => { if(tab === 'path') drawLines(); });

function renderWords(q=''){
  const ql = q.trim().toLowerCase();
  let html = topbar() + `<div class="rand"><button class="btn" id="fc">Тренировать слова</button></div>
    <input class="search" id="sq" placeholder="Поиск по слову или переводу" value="${esc(q)}">`;
  const curIdx = unlockedIndex();
  let any = false;
  for(let n = 1; n <= 20; n++){
    if(!isOpen(n)) continue;
    const items = VOCAB.map((v, i) => [v, i]).filter(([v]) => v.l === n && (!ql || v.zh.includes(ql) || v.ru.toLowerCase().includes(ql)));
    if(!items.length) continue;
    any = true;
    const L = lessonOf(n);
    html += `<div class="lhead">Урок ${n}<span class="zh">${esc(L.zh)}</span></div>`;
    items.forEach(([v, i]) => { html += `<div class="wrow"><div class="wcard"><div class="l"><div class="z zh">${esc(v.zh)}</div></div><div class="r">${esc(v.ru)}</div></div></div>`; });
  }
  if(!any) html += `<div class="lhead" style="color:#64748b">${ql ? 'Ничего не найдено.' : 'Словарь пока пуст. Слова урока появляются здесь, когда вы начинаете этот урок.'}</div>`;
  app.innerHTML = `<div class="screen">${html}</div>` + nav();
  bindNav();
  const inp = $('#sq'); inp.oninput = () => { const pos = inp.value; renderWords(pos); const n = $('#sq'); n.focus(); n.setSelectionRange(pos.length, pos.length); };
  $('#fc').onclick = startCards;
}

function renderProfile(){
  const lv = levelOf(S.xp), into = S.xp % 100;
  const doneL = NODES.filter(n => n.kind === 'lesson' && isDone(n.id)).length;
  const doneB = NODES.filter(n => n.kind === 'boss' && isDone(n.id)).length;
  const html = topbar() + `
    <div class="stat"><div>Уровень<div class="xpbar" style="width:200px"><i style="width:${into}%"></i></div></div><b>${lv}</b></div>
    <div class="stat"><span>Опыт</span><b>${S.xp}</b></div>
    <div class="stat"><span>Дней подряд</span><b>${S.streak}</b></div>
    <div class="stat"><span>Уроков пройдено</span><b>${doneL} / 20</b></div>
    <div class="stat"><span>Итоговых кейсов</span><b>${doneB} / 5</b></div>
    <div class="stat"><span>Слов просмотрено</span><b>${Object.keys(S.seen).length}</b></div>
    ${accountHTML()}
    <div style="margin:18px"><button class="btn ghost" id="reset">Сбросить прогресс</button></div>`;
  app.innerHTML = `<div class="screen">${html}</div>` + nav();
  bindNav();
  bindAccount();
  $('#reset').onclick = () => {
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="box"><h3 style="margin:0 0 6px">Сбросить прогресс?</h3><p style="color:#64748b;font-weight:600;margin:0 0 14px">Опыт, пройденные уровни и серия будут удалены.</p>
      <button class="btn bad" id="yes">Да, сбросить</button><div style="height:10px"></div><button class="btn ghost" id="no">Отмена</button></div>`;
    document.body.appendChild(m);
    $('#no', m).onclick = () => m.remove();
    $('#yes', m).onclick = () => { S = {xp:0, done:{}, streak:0, last:'', seen:{}, known:{}, opened:{}}; save(); m.remove(); tab = 'path'; render(); };
  };
}

/* ---------- level runner ---------- */
let L = null; // active run
function overlay(){ let o = $('#lvl'); if(!o){ o = document.createElement('div'); o.id = 'lvl'; o.className = 'lvl'; document.body.appendChild(o); } return o; }
function closeLevel(){ const o = $('#lvl'); if(o) o.remove(); L = null; $('#tip').classList.remove('on'); render(); }

function lessonTexts(les){
  const t = []; les.steps.forEach(s => { t.push(s[1], s[3], s[4], s[5]); });
  t.push(les.tone[1], les.tone[2], les.tone[3], les.build[1].replace(/ /g, ''));
  return t;
}
function startLevel(id){
  const node = NODES.find(n => n.id === id);
  let queue = [], meta;
  if(node.kind === 'lesson'){
    const les = lessonOf(node.n);
    const wids = wordsInTexts(lessonTexts(les), [les.n], 8);
    if(wids.length < 5){ VOCAB.forEach((v, i) => { if(v.l === les.n && !wids.includes(i) && wids.length < 5) wids.push(i); }); }
    if(!S.opened) S.opened = {}; S.opened[les.n] = 1; save();
    meta = {title: les.zh, sub: les.ru, tag: 'Урок ' + les.n, intro: les.intro, words: wids, n: les.n};
    queue.push({t: 'intro'}, {t: 'words'});
    les.steps.forEach((s, i) => queue.push({t: 'choice', s, i, total: les.steps.length, kind: 'Кейс'}));
    queue.push({t: 'tone', s: les.tone}, {t: 'build', s: les.build});
  } else {
    const B = bossOf(node.n); const st = STAGES[node.n - 1];
    const lessons = []; for(let n = st.from; n <= st.to; n++) lessons.push(n);
    const texts = []; B.steps.forEach(s => texts.push(s[1], s[3]));
    const wids = wordsInTexts(texts, lessons, 8);
    meta = {title: B.zh, sub: B.title, tag: 'Итог грейда ' + node.n, intro: B.intro, words: wids, n: null, boss: true};
    queue.push({t: 'intro'});
    if(wids.length) queue.push({t: 'words'});
    B.steps.forEach((s, i) => queue.push({t: 'choice', s, i, total: B.steps.length, kind: 'Итоговый кейс', boss: true}));
  }
  L = {id, node, meta, queue, pos: 0, gained: 0, right: 0, tasks: queue.filter(q => q.t !== 'intro' && q.t !== 'words').length, mode: 'level'};
  step();
}
function step(){
  if(L.pos >= L.queue.length) return finish();
  const q = L.queue[L.pos];
  const pct = Math.round(L.pos / L.queue.length * 100);
  const o = overlay();
  o.innerHTML = `<div class="lvl-top"><button class="x" id="cl">${IC.x}</button><div class="bar"><i style="width:${pct}%"></i></div></div><div class="lvl-body pop" id="body"></div><div id="foot"></div>`;
  $('#cl').onclick = closeLevel;
  if(q.t === 'intro') return showIntro();
  if(q.t === 'words') return showWords();
  if(q.t === 'choice') return showChoice(q, q.s, q.kind + ' ' + (q.i + 1) + ' из ' + q.total, 'Выберите наиболее уместный ответ', true);
  if(q.t === 'tone') return showChoice(q, null, 'Тон и этикет', q.s[0], false, q.s);
  if(q.t === 'build') return showBuild(q.s);
}
function next(){ L.pos++; step(); }
function footBtn(label, cb, cls=''){
  $('#foot').innerHTML = `<div class="lvl-foot"><button class="btn ${cls}" id="fbtn">${label}</button></div>`;
  $('#fbtn').onclick = cb;
}
function showIntro(){
  const m = L.meta;
  $('#body').innerHTML = `<span class="tag">${esc(m.tag)}</span><div class="big zh">${esc(m.title)}</div><div class="big" style="font-size:22px;margin-top:0">${esc(m.sub)}</div>
    <div class="lead">${m.boss ? 'Несколько ситуаций подряд, как на настоящих переговорах.' : 'Кейс, этикет и составление фразы.'}</div><div class="scene">${esc(m.intro)}</div>`;
  footBtn('Начать', next);
}
function showWords(){
  const m = L.meta;
  $('#body').innerHTML = `<span class="tag">Новые слова</span><div class="big" style="font-size:24px">Запомните перед кейсом</div><div class="lead">Эти слова встретятся в кейсе. В тексте кейса слова с пунктиром можно нажать, чтобы увидеть перевод.</div>` +
    m.words.map(i => { const v = VOCAB[i]; S.seen[v.zh] = 1; return `<div class="wcard"><div class="l"><div class="z zh">${esc(v.zh)}</div></div><div class="r">${esc(v.ru)}</div></div>`; }).join('');
  save();
  footBtn('Понятно', next);
}
function lessonN(){ return L && L.meta ? L.meta.n : null; }

/* choice: for 'choice' s=[who,zh,tr,ok,w1,w2,why]; for tone s=[ctx,ok,w1,w2,why] */
function showChoice(q, s, tag, prompt, withBubble, toneArr){
  let ok, opts, why, bubble = '';
  if(withBubble){
    ok = s[3]; opts = [s[3], s[4], s[5]]; why = s[6];
    bubble = `<div class="bubble" id="bub"><div class="who">${esc(s[0])}</div><div class="txt zh">${wrap(s[1], lessonN())}</div><div class="tr">${esc(s[2])}</div></div>
      <button class="trbtn" id="trb">Показать перевод</button>`;
  } else { ok = toneArr[1]; opts = [toneArr[1], toneArr[2], toneArr[3]]; why = toneArr[4]; }
  const sh = shuffle(opts);
  $('#body').innerHTML = `<span class="tag">${esc(tag)}</span><div style="height:10px"></div>${bubble}<div class="q">${esc(prompt)}</div>` +
    sh.map((o, i) => `<button class="opt zh" data-i="${i}">${esc(o)}</button>`).join('');
  const trb = $('#trb'); if(trb) trb.onclick = () => { $('#bub').classList.toggle('show'); trb.textContent = $('#bub').classList.contains('show') ? 'Скрыть перевод' : 'Показать перевод'; };
  let locked = false;
  $('#body').querySelectorAll('.opt').forEach(b => b.onclick = e => {
    if(e.target.closest('.w')) return;
    if(locked) return; locked = true;
    const picked = sh[+b.dataset.i]; const good = picked === ok;
    $('#body').querySelectorAll('.opt').forEach((x, i) => {
      const val = sh[i];
      const inf = OPTINFO[val] || {p:'', r:''};
      const isOk = val === ok, isPick = x === b;
      x.innerHTML = `<span class="bd">${isOk ? 'Верно' : 'Неверно'}</span><div class="zh2">${wrap(val, lessonN())}</div><div class="ru">${esc(inf.r)}</div>`;
      x.classList.add('rev');
      if(isOk) x.classList.add('ok'); else if(isPick) x.classList.add('no'); else x.classList.add('dim');
    });
    $('#body').style.paddingBottom = '260px';
    const gain = L.mode === 'rand' ? 5 : 10;
    if(good){ L.right++; addXP(gain); L.gained += gain; }
    else b.classList.add('shake');
    $('#foot').innerHTML = `<div class="fb ${good?'ok':'no'} pop"><h3>${good ? 'Верно! +' + gain + ' опыта' : 'Не совсем'}</h3><p>${esc(why)}</p><button class="btn ${good?'':'bad'}" id="fbtn">Продолжить</button></div>`;
    $('#fbtn').onclick = () => { if(L.mode === 'rand') randNext(); else next(); };
  });
}

function showBuild(s){
  const toks = s[1].split(' '), extra = (s[2] || '').split(' ').filter(Boolean);
  const bank = shuffle(toks.map((t, i) => ({t, id: 'a' + i})).concat(extra.map((t, i) => ({t, id: 'x' + i}))));
  let chosen = [];
  $('#body').innerHTML = `<span class="tag">Соберите фразу</span><div class="big" style="font-size:22px;margin:12px 0 8px">${esc(s[0])}</div>
    <div class="slots zh" id="slots"></div><div class="tiles zh" id="tiles"></div>`;
  function draw(){
    $('#slots').innerHTML = chosen.map(c => `<button class="tile" data-id="${c.id}">${esc(c.t)}</button>`).join('');
    $('#tiles').innerHTML = bank.map(c => `<button class="tile ${chosen.includes(c) ? 'used' : ''}" data-id="${c.id}">${esc(c.t)}</button>`).join('');
    $('#slots').querySelectorAll('.tile').forEach(b => b.onclick = () => { chosen = chosen.filter(c => c.id !== b.dataset.id); draw(); });
    $('#tiles').querySelectorAll('.tile:not(.used)').forEach(b => b.onclick = () => { chosen.push(bank.find(c => c.id === b.dataset.id)); draw(); });
    const btn = $('#fbtn'); if(btn) btn.disabled = !chosen.length;
  }
  footBtn('Проверить', check);
  function check(){
    const got = chosen.map(c => c.t).join(''), want = toks.join('');
    const good = got === want;
    $('#body').querySelectorAll('.tile').forEach(t => t.disabled = true);
    if(good){ L.right++; addXP(10); L.gained += 10; }
    $('#foot').innerHTML = `<div class="fb ${good?'ok':'no'} pop"><h3>${good ? 'Верно! +10 опыта' : 'Почти'}</h3>
      <p class="zh" style="font-size:19px;color:#0f172a">${wrap(want, lessonN())}</p><button class="btn ${good?'':'bad'}" id="fbtn">Продолжить</button></div>`;
    $('#fbtn').onclick = next;
  }
  draw();
}

function finish(){
  const first = !isDone(L.id);
  const bonus = L.node.kind === 'boss' ? 50 : 20;
  if(first){ S.done[L.id] = 1; addXP(bonus); }
  save();
  const o = overlay();
  const total = L.tasks;
  o.innerHTML = `<div class="lvl-body pop" style="align-items:center;justify-content:center;text-align:center"><div style="width:84px;height:84px;border-radius:50%;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:14px">${L.node.kind==='boss'?IC.cup.replace('<svg','<svg width="44" height="44"'):IC.check.replace('<svg','<svg width="44" height="44"')}</div>
    <div class="big" style="margin:0">${L.node.kind==='boss'?'Грейд пройден!':'Урок пройден!'}</div>
    <div class="lead">Верных ответов: ${L.right} из ${total}</div>
    <div class="chips" style="justify-content:center"><div class="chip">${IC.bolt}+${L.gained + (first ? bonus : 0)} опыта</div></div></div>
    <div class="lvl-foot"><button class="btn" id="fbtn">Продолжить</button></div>`;
  $('#fbtn').onclick = closeLevel;
}

/* ---------- random case ---------- */
function startRandom(){
  const cur = unlockedIndex();
  const pool = [];
  NODES.forEach((n, i) => {
    if(i > cur) return;
    if(n.kind === 'lesson') lessonOf(n.n).steps.forEach(s => pool.push({s, n: n.n}));
    else bossOf(n.n).steps.forEach(s => pool.push({s, n: null}));
  });
  L = {mode: 'rand', pool, right: 0, gained: 0, meta: {n: null}, queue: [], pos: 0};
  randNext();
}
function randNext(){
  const p = L.pool[Math.floor(Math.random() * L.pool.length)];
  L.meta = {n: p.n};
  const o = overlay();
  o.innerHTML = `<div class="lvl-top"><button class="x" id="cl">${IC.x}</button><div class="bar"><i style="width:100%"></i></div></div><div class="lvl-body pop" id="body"></div><div id="foot"></div>`;
  $('#cl').onclick = closeLevel;
  showChoice({}, p.s, 'Случайный кейс', 'Выберите наиболее уместный ответ', true);
}

/* ---------- flashcards ---------- */
function startCards(){
  const pool = VOCAB.map((v, i) => i).filter(i => isOpen(VOCAB[i].l));
  if(!pool.length){ const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = `<div class="box"><h3 style="margin:0 0 6px">Пока нет слов</h3><p style="color:#64748b;font-weight:600;margin:0 0 14px">Начните первый урок, и его слова появятся в карточках.</p><button class="btn" id="ok">Понятно</button></div>`; document.body.appendChild(m); $('#ok', m).onclick = () => m.remove(); return; }
  const maxLesson = Math.max(...pool.map(i => VOCAB[i].l));
  L = {mode: 'cards'};

const blankState = () => ({xp:0, done:{}, streak:0, last:'', seen:{}, known:{}, opened:{}});
const dnum = d => { const a = String(d||'').split('-').map(Number); return a.length === 3 ? a[0]*10000 + a[1]*100 + a[2] : 0; };
function mergeState(a, b){
  const o = blankState();
  o.xp = Math.max(a.xp||0, b.xp||0);
  ['done','seen','known','opened'].forEach(k => { o[k] = Object.assign({}, a[k]||{}, b[k]||{}); });
  const da = dnum(a.last), db = dnum(b.last);
  if(da > db){ o.last = a.last; o.streak = a.streak||0; }
  else if(db > da){ o.last = b.last; o.streak = b.streak||0; }
  else { o.last = a.last||''; o.streak = Math.max(a.streak||0, b.streak||0); }
  return o;
}
const syncText = () => cloud.sync === 'err' ? '<span style="color:#dc2626">Не удалось сохранить в облако, повторим при следующем действии</span>' : 'Прогресс сохраняется в аккаунте и доступен на любом устройстве';
function cloudSave(){
  if(!cloud.user || !cloud.ready) return;
  clearTimeout(cloud.t);

    try{
      await cloud.fs.setDoc(cloud.fs.doc(cloud.db, 'users', cloud.user.uid), {data: JSON.stringify(S), updated: Date.now()});

async function onUser(user){
  cloud.user = user; cloud.msg = '';
  if(user){
    try{
      const snap = await cloud.fs.getDoc(cloud.fs.doc(cloud.db, 'users', user.uid));
      let remote = null;
      if(snap.exists()){ try{ remote = JSON.parse(snap.data().data); }catch(e){} }
      let owner = null; try{ owner = localStorage.getItem(OWNER_KEY); }catch(e){}
      const local = Object.assign(blankState(), S);
      if(!owner || owner === user.uid) S = remote ? mergeState(local, remote) : local;
      else S = remote ? Object.assign(blankState(), remote) : blankState();
      try{ localStorage.setItem(OWNER_KEY, user.uid); localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
      cloud.sync = 'ok'; cloud.ready = true; cloudSave();
    }catch(e){ cloud.sync = 'err'; cloud.ready = false; cloud.msg = 'Не удалось загрузить прогресс. Проверьте правила Firestore и соединение.'; }
  } else { cloud.ready = false; }
  render();
}
async function initCloud(){
  if(!cloud.on) return;
  try{
    const [A, Au, F] = await Promise.all([import(SDK + 'firebase-app.js'), import(SDK + 'firebase-auth.js'), import(SDK + 'firebase-firestore.js')]);
    const fb = A.initializeApp(FIREBASE_CONFIG);
    cloud.au = Au; cloud.fs = F; cloud.auth = Au.getAuth(fb); cloud.db = F.getFirestore(fb);
    cloud.loaded = true;
    Au.onAuthStateChanged(cloud.auth, onUser);
  }catch(e){ cloud.on = false; if(tab === 'me') render(); }
}
